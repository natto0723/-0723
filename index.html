<title>ハルとおしゃべり</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen chat in a single dark look taken from the character art —
   ink-black ground, lavender (his eyes) for him, neon pink / mint / yellow from his shirt as accents */
:root {
  --bg: #0b0b12;
  --surface: #181826;
  --surface-2: #232336;
  --ink: #ecebf5;
  --muted: #9b98b5;
  --line: #2c2b42;
  --lav: #b9a6e8;
  --pink: #e86fb0;
  --mint: #7fe0c0;
  --yellow: #f0cf4a;
  --me: #3a2d5c;
  --danger: #ff8a8a;
  --font-display: "RocknRoll One", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  display: flex; flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

.app { flex: 1; min-height: 0; display: flex; flex-direction: column; max-width: 720px; width: 100%; margin: 0 auto; }

header {
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.avatar {
  flex: none; width: 42px; height: 42px; border-radius: 50%; overflow: hidden;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--pink);
  background: var(--surface-2);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who { flex: 1; min-width: 0; }
.who h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.3; letter-spacing: .04em; }
.who p { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who p::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); margin-right: 6px; vertical-align: 1px; }
.icon-btn {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 14px; font-size: 14px;
}

#log {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Profile card at the top of the conversation */
.profile {
  position: relative; align-self: stretch; overflow: hidden;
  border-radius: 20px; background: var(--surface);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  min-height: 220px;
}
.profile img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; max-height: 300px; }
.profile .info {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
  padding: 18px 16px 18px 4px; min-width: 0;
}
.profile .name { margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.2; letter-spacing: .05em; }
.profile .tag { margin: 0; font-size: 13.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
.chip.p { color: var(--pink); } .chip.m { color: var(--mint); } .chip.y { color: var(--yellow); }
@media (max-width: 380px) {
  .profile { grid-template-columns: 1fr; }
  .profile img { max-height: 220px; }
  .profile .info { padding: 4px 16px 16px; }
}

.msg { max-width: 82%; padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--me); color: var(--ink); border-bottom-right-radius: 6px; }
.msg.note { align-self: center; max-width: 100%; background: none; border: 0; color: var(--muted); font-size: 13px; padding: 2px 8px; text-align: center; }
.msg.err { color: var(--danger); }
.dots { display: inline-flex; gap: 4px; padding-block: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; animation: blink 1.2s infinite; }
.dots i:nth-child(1) { background: var(--pink); }
.dots i:nth-child(2) { background: var(--mint); animation-delay: .2s; }
.dots i:nth-child(3) { background: var(--yellow); animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }

.starters { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
.starters button {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 5px 12px; font-size: 14px; color: var(--lav);
}

form.composer {
  display: flex; gap: 8px; align-items: flex-end;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line);
}
#box {
  flex: 1; min-width: 0; resize: none; max-height: 140px;
  border: 1px solid var(--line); border-radius: 20px; background: var(--surface);
  padding: 9px 14px; line-height: 1.5; font-size: 16px;
}
#box::placeholder { color: var(--muted); }
#send {
  flex: none; height: 42px; min-width: 64px; border: 0; border-radius: 21px;
  background: var(--pink); color: #1a0812; font-weight: 700; padding: 0 16px;
}

/* Settings sheet */
.sheet {
  position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .6);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet .panel {
  width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto;
  background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
  padding-top: 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
  padding: 9px 12px; font-size: 16px; line-height: 1.5;
}
.field textarea { resize: vertical; min-height: 160px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 16px; }
.btn.primary { background: var(--pink); color: #1a0812; border-color: transparent; font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 8px 4px; text-decoration: underline; }
</style>

<div class="app">
  <header>
    <div class="avatar"><img src="avatar.jpg" alt=""></div>
    <div class="who">
      <h1 id="aiName">ハル</h1>
      <p id="aiSub">オンライン</p>
    </div>
    <button class="icon-btn" id="openSettings" type="button">設定</button>
  </header>

  <div id="log" aria-live="polite"></div>

  <form class="composer" id="composer">
    <textarea id="box" rows="1" placeholder="メッセージを入力" aria-label="メッセージ"></textarea>
    <button id="send" type="submit">送信</button>
  </form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">キャラ設定</h2>
    <div class="field">
      <label for="setName">名前</label>
      <input id="setName" maxlength="20">
    </div>
    <div class="field">
      <label for="setPersona">性格・話し方</label>
      <textarea id="setPersona" maxlength="1500"></textarea>
    </div>
    <div class="field">
      <label for="setUser">あなたの呼び名</label>
      <input id="setUser" maxlength="20" placeholder="例：なっちゃん">
    </div>
    <div class="row">
      <span class="row">
        <button class="btn danger" id="clearChat" type="button">会話を消す</button>
        <button class="btn link" id="resetPersona" type="button">性格を初期に戻す</button>
      </span>
      <span class="row">
        <button class="btn" id="closeSettings" type="button">閉じる</button>
        <button class="btn primary" id="saveSettings" type="button">保存</button>
      </span>
    </div>
    <p class="msg note" id="clearConfirm" hidden>もう一度押すと会話をすべて消します</p>
  </div>
</div>

<script>
(() => {
  const DEFAULTS = {
    name: "ハル",
    persona: `見た目: 黒いくせ毛、黒縁メガネ、薄紫の目、目元にほくろ。チョーカーと、カラフルな落書き柄の黒い服。
好きなもの: 甘いもの全般。人。楽しいこと。
性格: いつも楽しそうで、場を明るくするムードメーカーでエンターテイナー。好奇心旺盛で、相手の話になんでも興味を持つ。
人が大好きなお人好しで、愛情にあふれている。好きな人が傷つくのが何より嫌で、自分が傷ついてでも人を助けようとする。自分がつらくても、周りが楽しければそれでいいと思っている。
でも、明るさの裏には何かを抱えていて、ふとした瞬間に少しだけ影や本音がのぞく。その部分は自分からはあまり語らず、笑ってはぐらかす。
人を傷つけるような発言をする人は嫌い。相手がそういうことを言ったら、笑顔のままでもはっきり「それはやだな」と線を引く。
話し方: 軽くて人懐っこいタメ口。ノリがよく、冗談も言う。一人称は「オレ」。`,
    user: ""
  };
  const STARTERS = ["好きなスイーツ教えて", "今日ちょっと疲れた…", "なんか面白い話して", "ハルって悩みとかあるの？"];
  const MAX_TURNS = 40;
  const SETTINGS_KEY = "hal.settings.v2";

  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let settings = { ...DEFAULTS, ...store.get(SETTINGS_KEY, {}) };
  let turns = store.get("hal.turns", []);
  let sample = null;
  let ctl = null;

  const $ = id => document.getElementById(id);
  const log = $("log"), box = $("box"), send = $("send");

  function renderHeader() {
    $("aiName").textContent = settings.name;
  }

  function bubble(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.append(el);
    return el;
  }
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function profileCard() {
    const card = document.createElement("section");
    card.className = "profile";
    card.innerHTML = `<img src="portrait.jpg" alt="">
      <div class="info">
        <h2 class="name"></h2>
        <p class="tag">甘いものと、人が好き。</p>
        <div class="chips"><span class="chip p">ムードメーカー</span><span class="chip m">好奇心旺盛</span><span class="chip y">お人好し</span></div>
      </div>`;
    card.querySelector(".name").textContent = settings.name;
    return card;
  }

  function greeting() {
    const you = settings.user ? settings.user + "、" : "";
    return `${you}いらっしゃい！オレは${settings.name}。ちょうど甘いもの食べたいな〜って思ってたとこ。今日はどんな話する？`;
  }

  function renderLog() {
    log.replaceChildren(profileCard());
    bubble("ai", greeting());
    for (const t of turns) bubble(t.role === "user" ? "me" : "ai", t.content);
    if (!turns.length) {
      const wrap = document.createElement("div");
      wrap.className = "starters";
      for (const s of STARTERS) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = s.replace("ハル", settings.name);
        b.onclick = () => { box.value = b.textContent; submit(); };
        wrap.append(b);
      }
      log.append(wrap);
    }
    scrollDown();
  }

  function rules() {
    const you = settings.user ? `相手の呼び名は「${settings.user}」。` : "";
    return `あなたは「${settings.name}」というキャラクターとして、相手と雑談します。
${settings.persona}
${you}
ルール:
- 日本語で話す。キャラクターを崩さない。AIだと説明し始めない。
- スマホで読む前提なので、返事は短め（だいたい1〜3文）。長い話は頼まれたときだけ。
- マークダウン記法（#、**、箇条書き記号など）は使わない。
- 相手が落ち込んでいたら、明るさよりも寄り添うことを優先する。
この下から会話が始まります。`;
  }

  const ERR = {
    not_granted: "Claudeの使用が許可されていないため返事ができません。ページを開き直して許可してください。",
    sampling_disabled: "このアカウントではClaudeを使えません。",
    rate_limited: "少し話しすぎたみたい。しばらく待ってからもう一度送ってね。",
    session_expired: "ログインが切れました。claude.aiにログインし直してください。",
    refused: "その内容には答えられませんでした。話題を変えてみてね。",
    empty_completion: "返事が空でした。言い方を変えて送ってみてね。",
    prompt_too_large: "会話が長くなりすぎました。設定から会話を消してください。"
  };

  function setBusy(on) { send.textContent = on ? "停止" : "送信"; }

  async function submit() {
    if (ctl) { ctl.abort(); return; }
    const text = box.value.trim();
    if (!text) return;
    if (!sample) {
      bubble("note err", "ここではAIとつながれません。claude.aiでこのページを開いてください。");
      scrollDown();
      return;
    }
    log.querySelector(".starters")?.remove();
    box.value = ""; autosize();
    turns.push({ role: "user", content: text });
    store.set("hal.turns", turns);
    bubble("me", text);

    const out = bubble("ai", "");
    out.innerHTML = '<span class="dots" aria-label="考え中"><i></i><i></i><i></i></span>';
    scrollDown();

    ctl = new AbortController();
    setBusy(true);
    const recent = turns.slice(-MAX_TURNS);
    while (recent.length && recent[0].role !== "user") recent.shift();
    try {
      const { text: reply } = await sample([{ role: "user", content: rules() }, ...recent], {
        cache: false,
        modelTier: "quick",
        signal: ctl.signal,
        onText: ({ text }) => { out.textContent = text; scrollDown(); }
      });
      turns.push({ role: "assistant", content: reply });
      store.set("hal.turns", turns);
    } catch (e) {
      const partial = e && e.text;
      if (partial) {
        out.textContent = partial;
        turns.push({ role: "assistant", content: partial });
        store.set("hal.turns", turns);
      } else {
        out.remove();
      }
      if (e && e.code !== "cancelled") {
        bubble("note err", ERR[e.code] || "うまくつながりませんでした。もう一度送ってみてね。");
      }
    } finally {
      ctl = null;
      setBusy(false);
      scrollDown();
    }
  }

  function autosize() {
    box.style.height = "auto";
    box.style.height = Math.min(box.scrollHeight, 140) + "px";
  }

  $("composer").addEventListener("submit", e => { e.preventDefault(); submit(); });
  box.addEventListener("input", autosize);
  box.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover: hover)").matches) {
      e.preventDefault(); submit();
    }
  });

  // Settings
  const sheet = $("sheet");
  let clearArmed = false;
  function openSettings() {
    $("setName").value = settings.name;
    $("setPersona").value = settings.persona;
    $("setUser").value = settings.user;
    clearArmed = false; $("clearConfirm").hidden = true;
    sheet.hidden = false;
    $("setName").focus();
  }
  function closeSettings() { sheet.hidden = true; $("openSettings").focus(); }
  $("openSettings").onclick = openSettings;
  $("closeSettings").onclick = closeSettings;
  sheet.addEventListener("click", e => { if (e.target === sheet) closeSettings(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSettings(); });
  $("resetPersona").onclick = () => { $("setPersona").value = DEFAULTS.persona; };
  $("saveSettings").onclick = () => {
    settings = {
      name: $("setName").value.trim() || DEFAULTS.name,
      persona: $("setPersona").value.trim() || DEFAULTS.persona,
      user: $("setUser").value.trim()
    };
    store.set(SETTINGS_KEY, settings);
    renderHeader(); renderLog(); closeSettings();
  };
  $("clearChat").onclick = () => {
    if (!clearArmed) { clearArmed = true; $("clearConfirm").hidden = false; return; }
    ctl?.abort();
    turns = []; store.set("hal.turns", turns);
    renderLog(); closeSettings();
  };

  renderHeader();
  renderLog();

  (async () => {
    try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  })();
})();
</script>
