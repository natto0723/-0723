<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SELECTEAR City Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Flow: START -> city map (drag to look around, tap a spot) -> アジト (hideout: rainy window, 3 gacha machines).
   Same tokens and slanted buttons as the home screen so the two pages join up. Single dark neon look. */
:root {
  --bg: #07050c;
  --panel: rgba(13, 10, 26, .95);
  --ink: #f1efff;
  --dim: #a7a2c6;
  --violet: #9b5cff;
  --blue: #4f8cff;
  --ice: #d9e6ff;
  --pink: #ff6ec8;
  --gold: #f2c14e;
  --cyan: #48e1ff;
  --line: rgba(150, 120, 255, .45);
  --font-latin: "Cinzel", "Times New Roman", serif;
  --font-menu: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-num: "Chakra Petch", "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.scene { position: fixed; inset: 0; display: none; overflow: hidden; }
.scene.on { display: block; animation: sceneIn .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes sceneIn { from { opacity: 0; } }
@keyframes blink { 50% { opacity: .3; } }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.flash { position: fixed; inset: 0; z-index: 90; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; padding: 10px 16px; border-radius: 12px; background: rgba(10, 8, 16, .95); border: 1px solid var(--violet); font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

/* shared top bar */
.topbar { position: absolute; z-index: 10; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(5, 3, 12, .85), transparent); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.back { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 10px; border-radius: 12px; border: 1px solid rgba(201, 198, 214, .45); background: rgba(8, 5, 18, .78); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font: 700 13px var(--font-body); cursor: pointer; }
.back svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.back:hover { border-color: #fff; }
.place { text-align: center; min-width: 0; }
.place b { display: block; font: 800 clamp(13px, 3.4vw, 17px)/1.1 var(--font-latin); letter-spacing: .22em; color: var(--ice); text-shadow: 0 0 10px rgba(155, 92, 255, .8); white-space: nowrap; }

  /* scenes */
  let scene = "start";
  function show(id) { $("toast").hidden = true; for (const s of ["start", "map", "hideout"]) $(s).classList.toggle("on", s === id); scene = id; if (id === "map") enterMap(); if (id === "hideout") rainSize(); }
  for (const b of document.querySelectorAll("[data-go]")) b.addEventListener("click", () => { back(); show(b.dataset.go); });
  $("startBtn").addEventListener("click", () => { gameStartSE(); buzz([30, 30, 60]); flash(); setTimeout(() => show("map"), reduce ? 0 : 250); });

  /* =========================================================
     MAP: the picture covers the screen; drag to look around. Spots in % of the picture.
     ========================================================= */
  const RATIO = 1672 / 941;
  const SPOTS = [
    { id: "hideout", name: "アジト", en: "HIDEOUT", x: 46.5, y: 70.5, kind: "home" },
    { id: "tower", name: "通信塔", en: "COMMS", x: 45.5, y: 9, kind: "locked" },
    { id: "clinic", name: "医療区", en: "CLINIC", x: 20, y: 60, kind: "locked" },
    { id: "factory", name: "工場跡", en: "FACTORY", x: 18, y: 18, kind: "locked" },
    { id: "port", name: "港湾", en: "PORT", x: 85, y: 17, kind: "locked" },
    { id: "park", name: "遊園地跡", en: "PARK", x: 75, y: 63, kind: "locked" },
    { id: "east", name: "東外周区", en: "EAST", x: 87.5, y: 44, kind: "locked" },
    { id: "core", name: "爆心地", en: "GROUND ZERO", x: 60, y: 41, kind: "danger" }
  ];
  const world = $("world"), vp = $("vp");
  for (const s of SPOTS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "pin " + s.kind; b.style.left = s.x + "%"; b.style.top = s.y + "%";
    b.setAttribute("aria-label", s.name + (s.kind === "home" ? "" : "（準備中）"));
    b.innerHTML = `<span class="tag"><small>${s.en}</small>${s.name}</span><span class="dot"></span>`;
    b.addEventListener("click", e => { e.stopPropagation(); if (moved) return; tapSpot(s, b); });
    world.append(b);
  }
  let W = 0, H = 0, mw = 0, mh = 0, ox = 0, oy = 0, scale = 1;
  function layout() {
    W = innerWidth; H = innerHeight;
    mw = W; mh = W / RATIO; if (mh < H) { mh = H; mw = H * RATIO; }
    // phones: show the map a little larger so labels stay readable, still draggable
    if (W < 700) { mw *= 1.15; mh *= 1.15; }
    world.style.width = mw + "px"; world.style.height = mh + "px";
    clampPan(); apply();
  }
  function clampPan() { ox = Math.min(0, Math.max(W - mw, ox)); oy = Math.min(0, Math.max(H - mh, oy)); }
  function apply() { world.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`; }
  function centerOn(s) { ox = W / 2 - mw * s.x / 100; oy = H / 2 - mh * s.y / 100; clampPan(); apply(); }
  let entered = false;
  function enterMap() {
    world.classList.remove("zoom"); scale = 1; layout();
    if (!entered) { entered = true; centerOn(SPOTS[0]); }
    const sc = document.createElement("div"); sc.className = "scan"; $("map").append(sc); setTimeout(() => sc.remove(), 1200);
  }
  addEventListener("resize", () => { if (scene === "map") layout(); rainSize(); });

  // drag to pan (mouse and touch)
  let drag = null, moved = false;
  vp.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; moved = false; vp.setPointerCapture(e.pointerId); vp.classList.add("drag"); });
  vp.addEventListener("pointermove", e => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    ox = drag.ox + dx; oy = drag.oy + dy; clampPan(); apply();
  });
  const end = () => { drag = null; vp.classList.remove("drag"); setTimeout(() => { moved = false; }, 0); };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  // pointer capture sends the click to the viewport; find the pin under the finger ourselves
  vp.addEventListener("click", e => {
    if (moved) return;
    const el = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains("pin"));
    if (el) el.click();
  });

  let busy = false;
  function tapSpot(s, el) {
    if (busy) return;
    if (s.kind !== "home") { tone(330, .12, "triangle", .08); toast(s.kind === "danger" ? `${s.name}：立入禁止エリアです` : `${s.name}：まだ行けません（準備中）`); return; }
    busy = true; gameStartSE(); buzz([20, 40, 20]); $("maphint").hidden = true;
    // zoom the camera into the hideout, then cut to the inside
    const z = 2.4, px = mw * s.x / 100, py = mh * s.y / 100;
    world.classList.add("zoom"); scale = z; ox = W / 2 - px * z; oy = H / 2 - py * z; apply();
    setTimeout(() => { flash(); show("hideout"); busy = false; $("maphint").hidden = false; }, reduce ? 0 : 850);
  }

  /* =========================================================
     HIDEOUT: rain on the window + 3 empty gacha machines
     ========================================================= */
  const GACHAS = [
    { id: "standard", name: "Standard", jp: "スタンダードガチャ", tone: "", caps: ["#9b5cff", "#4f8cff", "#48e1ff", "#d9e6ff"] },
    { id: "pickup", name: "Pick Up", jp: "ピックアップガチャ", tone: "pink", caps: ["#ff6ec8", "#9b5cff", "#ffb1e3", "#ff8fb0"] },
    { id: "premium", name: "Premium", jp: "プレミアムガチャ", tone: "gold", caps: ["#f2c14e", "#fff1b8", "#9b5cff", "#ffd36e"] }
  ];
  const CAP_POS = [[14, 52], [38, 60], [62, 54], [26, 32], [52, 36], [70, 30], [44, 14], [8, 30], [78, 50]];
  const box = $("machines");
  for (const g of GACHAS) {
    const d = document.createElement("div"); d.className = "gm " + g.tone;
    const caps = CAP_POS.map(([x, y], i) => `<i style="left:${x}%;top:${y}%;--a:${g.caps[i % g.caps.length]}"></i>`).join("");
    d.innerHTML = `<div class="banner"><b>${g.name}</b><small>${g.jp}</small></div>
      <button class="machine" type="button" aria-label="${g.jp}を回す"><span class="dome">${caps}</span><span class="body"><span class="plate">SELECTEAR</span><span class="handle"></span><span class="outlet"><span class="cap"></span></span></span></button>
      <div class="pulls"><button type="button" data-n="1"><b>1回</b><small>◆ ---</small></button><button type="button" class="ten" data-n="10"><b>10回</b><small>◆ ---</small></button></div>`;
    const m = d.querySelector(".machine");
    const pull = () => {
      if (m.classList.contains("spin")) return;
      gachaSE(); buzz(30); m.classList.remove("spin"); void m.offsetWidth; m.classList.add("spin");
      setTimeout(() => { m.classList.remove("spin"); openSoon(g); }, reduce ? 100 : 1700);
    };
    m.addEventListener("click", pull);
    for (const b of d.querySelectorAll(".pulls button")) b.addEventListener("click", () => { decide(); pull(); });
    box.append(d);
  }
  // page dots for the swipe view on phones
  $("dots").innerHTML = GACHAS.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("");
  box.addEventListener("scroll", () => { const i = Math.round(box.scrollLeft / (box.scrollWidth - box.clientWidth || 1) * (GACHAS.length - 1)); [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i)); }, { passive: true });
  function openSoon(g) { $("soonTitle").textContent = g.jp; $("soonText").textContent = "このガチャにはまだ中身が入っていません。"; $("p-soon").classList.add("on"); }
  $("soonClose").addEventListener("click", () => { back(); $("p-soon").classList.remove("on"); });
  $("p-soon").addEventListener("click", e => { if (e.target === $("p-soon")) $("p-soon").classList.remove("on"); });

  // rain over the hideout window
  const cv = $("rain"), g = cv.getContext("2d"); let rw = 0, rh = 0;
  function rainSize() { const r = Math.min(devicePixelRatio || 1, 2); rw = innerWidth; rh = innerHeight; cv.width = rw * r; cv.height = rh * r; g.setTransform(r, 0, 0, r, 0, 0); }
  rainSize();
  const drops = Array.from({ length: 90 }, () => ({ x: Math.random() * 1600, y: Math.random() * 1000, l: 10 + Math.random() * 22, v: 7 + Math.random() * 8 }));
  (function tick() {
    if (scene === "hideout" && !reduce) {
      g.clearRect(0, 0, rw, rh); g.lineWidth = 1; g.strokeStyle = "rgba(180,200,255,.22)";
      for (const d of drops) { d.y += d.v; d.x -= .8; if (d.y > rh * .66) { d.y = -20; d.x = Math.random() * (rw + 60); } g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x - 1.5, d.y + d.l); g.stroke(); }
    }
    requestAnimationFrame(tick);
  })();

  addEventListener("keydown", e => {
    if (e.key === "Escape") { if ($("p-soon").classList.contains("on")) $("p-soon").classList.remove("on"); else if (scene === "hideout") show("map"); else if (scene === "map") show("start"); }
    if (scene === "start" && (e.key === "Enter" || e.key === " ") && document.activeElement !== $("startBtn")) { e.preventDefault(); $("startBtn").click(); }
  });
})();
</script>

</html>
