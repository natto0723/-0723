<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SELECTEAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@600;700&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Flow: splash (tap = sound allowed) -> title (title BGM) -> home (桐嗚 / 実優). One full-screen scene at a time, single dark neon look. */
:root {
  --bg: #07050c;
  --panel: rgba(13, 10, 26, .94);
  --ink: #f1efff;
  --dim: #a29dc2;
  --violet: #9b5cff;
  --blue: #4f8cff;
  --ice: #d9e6ff;
  --pink: #ff6ec8;
  --line: rgba(150, 120, 255, .45);
  --font-latin: "Cinzel", "Times New Roman", serif;
  --font-menu: "Cormorant Garamond", "Times New Roman", serif;
  --font-name: "Zen Antique", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-num: "Chakra Petch", "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.scene { position: fixed; inset: 0; display: none; overflow: hidden; touch-action: manipulation; }
.scene.on { display: block; animation: sceneIn .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes sceneIn { from { opacity: 0; } }
.bgimg { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(20px) brightness(.4) saturate(1.3); }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(3, 2, 10, .85) 100%); }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }
.flash { position: fixed; inset: 0; z-index: 90; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
@keyframes blink { 50% { opacity: .25; } }
.col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.col > :first-child { margin-top: auto; }
.col > :last-child { margin-bottom: auto; }

/* ---------- splash ---------- */
#splash { background: #000; cursor: pointer; }
#splash .press { margin-top: 8px; }
.sp-logo { width: min(420px, 78vw); opacity: .9; }
.sp-logo, .logo img { -webkit-mask-image: radial-gradient(ellipse 52% 60% at 50% 50%, #000 78%, transparent 100%); mask-image: radial-gradient(ellipse 52% 60% at 50% 50%, #000 78%, transparent 100%); }
.sp-note { font-size: 12px; color: var(--dim); margin: 0; }

/* ---------- title ---------- */
.eyebrow { font-family: var(--font-latin); letter-spacing: .45em; font-size: 12px; color: var(--dim); margin: 0; padding-left: .45em; }
.logo { margin: 0; line-height: 0; position: relative; }
.logo img { width: min(560px, 88vw); height: auto; filter: drop-shadow(0 0 18px rgba(155, 92, 255, .55)); }
.logo img.glitch { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; pointer-events: none; }
.logo img.g1 { filter: hue-rotate(-60deg) saturate(2); animation: gl1 5s infinite; }
.logo img.g2 { filter: hue-rotate(60deg) saturate(2); animation: gl2 5s infinite; }
@keyframes gl1 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .7; transform: translate(-4px, 1px); } 96% { opacity: .7; transform: translate(3px, -1px); } }
@keyframes gl2 { 0%, 93%, 100% { opacity: 0; transform: none; } 94% { opacity: .7; transform: translate(4px, -1px); } 97% { opacity: .7; transform: translate(-3px, 1px); } }
.hero { width: auto; max-width: min(620px, 100%); max-height: 42vh; object-fit: contain; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 0 60px rgba(155, 92, 255, .55); animation: float 5s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(-6px); } to { transform: translateY(6px) scale(1.015); } }
.press { font-family: var(--font-num); font-weight: 700; letter-spacing: .5em; padding-left: .5em; font-size: 15px; color: #fff; text-shadow: 0 0 8px var(--violet), 0 0 22px var(--violet); animation: blink 1.4s infinite; }
.press small { display: block; margin-top: 8px; font: 700 12px/1 var(--font-body); letter-spacing: .3em; color: var(--dim); text-shadow: none; }
.ver { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 600 10px var(--font-latin); letter-spacing: .2em; color: var(--dim); }
.chip-btn { position: absolute; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(201, 198, 214, .4); background: rgba(10, 8, 16, .75); font: 700 12px/1 var(--font-body); cursor: pointer; }
.chip-btn:hover { border-color: #fff; }
.chip-btn[aria-pressed="false"] { color: var(--dim); }
.chip-btn.l { left: max(12px, env(safe-area-inset-left, 0px)); }
.chip-btn.r { right: max(12px, env(safe-area-inset-right, 0px)); }
.chip-btn.l2 { left: max(12px, env(safe-area-inset-left, 0px)); top: calc(54px + env(safe-area-inset-top, 0px)); }

/* ---------- home ---------- */
.stage { position: absolute; left: 50%; top: 50%; transform: translate(var(--tx, -50%), -50%); }
.stage img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }
.hot { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 40%; }
.spin { position: absolute; border-radius: 50%; border: 3px solid transparent; border-top-color: #e6d4ff; border-right-color: rgba(230, 212, 255, .4); filter: drop-shadow(0 0 6px var(--violet)); animation: rot 1.1s linear infinite; pointer-events: none; }
@keyframes rot { to { rotate: 360deg; } }
.sbar { position: absolute; overflow: hidden; pointer-events: none; border-radius: 2px; }
.sbar i { position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(240, 225, 255, .85), transparent); animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { from { translate: -120% 0; } to { translate: 280% 0; } }
.talkhint { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: rgba(10, 8, 16, .72); border: 1px solid rgba(155, 92, 255, .6); font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 0 14px rgba(155, 92, 255, .45); animation: blink 2.2s ease-in-out infinite; pointer-events: none; }
.sb2 .talkhint { border-color: rgba(255, 110, 200, .7); box-shadow: 0 0 14px rgba(255, 110, 200, .45); }

/* menu: slanted buttons stacked under the logo (same layout on both homes).
   Wide screens: placed over the picture's own menu area (JS sets --l/--t/--w/--bh/--gap in px).
   Narrow screens: a stack at the bottom centre. */
.hmenu { --k: 255, 110, 200; position: absolute; z-index: 4; left: var(--l, 50%); top: var(--t, 50%); width: var(--w, 260px); display: flex; flex-direction: column; gap: var(--gap, 8px); }
#standby .hmenu { --k: 165, 110, 255; }
.mb { position: relative; height: var(--bh, 44px); width: 100%; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; font: 600 calc(var(--bh, 44px) * .56)/1 var(--font-menu); letter-spacing: .04em; color: #f6ecff; text-shadow: 0 0 8px rgba(var(--k), .7); }
.mb::before { content: ""; position: absolute; inset: 0; transform: skewX(-24deg); border: 1.5px solid rgba(var(--k), .85); border-radius: 3px; background: linear-gradient(90deg, rgb(48, 12, 46), rgb(28, 8, 34)); box-shadow: 0 0 10px rgba(var(--k), .35), inset 0 0 14px rgba(var(--k), .18); transition: box-shadow .2s, background .2s; }
#standby .mb::before { background: linear-gradient(90deg, rgb(30, 14, 58), rgb(14, 8, 34)); }
#standby .mb.primary::before { background: linear-gradient(90deg, rgba(var(--k), .55), rgba(var(--k), .25) 60%, transparent), #1a0c34; }
/* 桐嗚's picture has an icon row (START…EXIT) under the logo: a dark glass plate hides it behind the new buttons */
#standby:not(.narrow) .hmenu::before { content: ""; position: absolute; z-index: -1; left: -4%; right: -4%; top: calc(var(--gap) * -1); bottom: calc(var(--gap) * -1); border-radius: 10px; border: 1px solid rgba(165, 110, 255, .45); background: rgba(10, 6, 24, .9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 0 24px rgba(155, 92, 255, .35); }
.mb span { position: relative; }
.mb.primary { color: #fff; }
.mb.primary::before { background: linear-gradient(90deg, rgba(var(--k), .55), rgba(var(--k), .25) 60%, transparent), #2a0b2e; border-color: #fff; box-shadow: 0 0 18px rgba(var(--k), .8), inset 0 0 18px rgba(255, 255, 255, .2); }
.mb.primary span::before { content: "»"; margin-right: .5em; opacity: .9; }
.mb:hover::before, .mb:focus-visible::before { box-shadow: 0 0 22px rgba(var(--k), .95), inset 0 0 18px rgba(var(--k), .35); border-color: #fff; }
.mb:focus-visible { outline: none; }
.mb:active { transform: translateX(3px); }
.sb.narrow .hmenu { --bh: 37px; --gap: 6px; left: 50%; top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: min(250px, 64vw); transform: translateX(-50%); }
.sb.narrow .talkhint { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); left: auto; right: max(12px, env(safe-area-inset-right, 0px)); transform: none; font-size: 12px; padding: 7px 12px; }
.sb.narrow .hmenu::before { content: ""; position: absolute; inset: -14px -26px; z-index: -1; border-radius: 16px; background: rgba(8, 5, 16, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

/* talk window */
.talk { position: fixed; inset: 0; z-index: 30; display: none; }
.talk.on { display: block; }
.talk .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5, 3, 10, .85) 0%, rgba(5, 3, 10, .35) 45%, transparent 70%); }
.win { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(760px, calc(100% - 24px)); min-height: 132px; padding: 26px 20px 18px; border-radius: 14px; background: rgba(12, 8, 22, .92); border: 2px solid rgba(155, 92, 255, .85); box-shadow: 0 0 22px rgba(155, 92, 255, .5), inset 0 0 22px rgba(155, 92, 255, .2); cursor: pointer; animation: up .3s ease-out; }
@keyframes up { from { translate: 0 20px; opacity: 0; } }
.tname { position: absolute; left: 16px; top: -16px; padding: 4px 14px; border-radius: 8px; background: #1a1030; border: 1px solid var(--violet); font-family: var(--font-name); font-size: 17px; letter-spacing: .08em; text-shadow: 0 0 8px var(--violet); }
.ttext { font-size: clamp(15px, 3.8vw, 18px); line-height: 1.8; font-weight: 700; min-height: 3.6em; white-space: pre-wrap; }
.tnext { position: absolute; right: 16px; bottom: 10px; color: #e6d4ff; font-size: 13px; animation: bob .8s ease-in-out infinite alternate; }
@keyframes bob { to { translate: 0 4px; } }
.choices { position: absolute; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(420px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
.choices button { padding: 13px 16px; border-radius: 12px; border: 1px solid rgba(155, 92, 255, .7); background: rgba(12, 8, 22, .92); font: 700 15px/1.2 var(--font-body); cursor: pointer; text-align: left; animation: up .25s ease-out both; }
.choices button::before { content: "▸ "; color: #d8b8ff; }
.choices button:hover { border-color: #fff; box-shadow: 0 0 16px var(--violet); }
.talk.pink .win { border-color: rgba(255, 110, 200, .9); box-shadow: 0 0 22px rgba(255, 110, 200, .5), inset 0 0 22px rgba(255, 110, 200, .2); }
.talk.pink .tname { border-color: var(--pink); background: #2a1028; text-shadow: 0 0 8px var(--pink); }
.talk.pink .choices button { border-color: rgba(255, 110, 200, .7); }

/* ---------- panels ---------- */
.panel { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(3, 2, 10, .8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.panel.on { display: flex; animation: sceneIn .3s; }
.card-box { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: 0 0 60px rgba(155, 92, 255, .35); }
.card-box h3 { font: 800 16px var(--font-latin); letter-spacing: .25em; margin: 0 0 14px; color: var(--ice); }
.card-box.center { text-align: center; }
.xbtn { display: block; margin: 16px auto 0; font: 800 12px var(--font-latin); letter-spacing: .25em; color: var(--ice); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 10px 26px; cursor: pointer; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid rgba(150, 120, 255, .2); }
.row:last-of-type { border-bottom: 0; }
.tog { font: 800 12px var(--font-latin); letter-spacing: .1em; padding: 7px 14px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--dim); min-width: 74px; }
.tog.on { background: var(--violet); color: #fff; border-color: var(--violet); box-shadow: 0 0 16px rgba(155, 92, 255, .6); }
.seg { display: flex; gap: 4px; }
.seg .tog { min-width: 0; font-family: var(--font-body); }
.tog.danger { color: #ff9ab8; border-color: rgba(255, 154, 184, .5); }
input[type=range] { width: 150px; accent-color: var(--violet); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim); font: 700 12px var(--font-body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: rgba(155, 92, 255, .35); color: #fff; border-color: var(--violet); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.thumb { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; cursor: pointer; background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lightbox { position: fixed; inset: 0; z-index: 70; background: rgba(2, 1, 8, .95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; }
.lightbox.on { display: flex; }
.lightbox img { max-width: 100%; max-height: 74%; object-fit: contain; border: 1px solid var(--line); border-radius: 10px; }
.btnrow { display: flex; gap: 10px; justify-content: center; align-items: center; }
.btnrow .xbtn { margin: 0; }
.credit { text-align: center; line-height: 2; }
.credit b { font-family: var(--font-latin); letter-spacing: .15em; color: var(--ice); }
.credit a { color: var(--ice); }
.small { font-size: 12px; color: var(--dim); margin: 0; }
.soon { font: 800 clamp(26px, 7vw, 40px)/1.1 var(--font-latin); letter-spacing: .12em; margin: 6px 0 10px; background: linear-gradient(180deg, #fff, var(--ice) 40%, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; padding: 10px 16px; border-radius: 12px; background: rgba(10, 8, 16, .95); border: 1px solid var(--violet); font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

@media (orientation: landscape) and (max-height: 540px) {
  .col { gap: 8px; }
  .logo img { width: min(420px, 60vw); }
  .hero { max-height: 34vh; }
}
@media (prefers-reduced-motion: reduce) {
  .hero, .press, .logo img.glitch, .spin, .sbar i, .talkhint, .tnext { animation: none !important; }
}
</style>

<!-- SPLASH: one tap here lets the browser play the title music -->
<section class="scene on" id="splash" aria-label="スタート">
  <div class="col">
    <img class="sp-logo" src="img/logo_purple.webp" alt="selectear セレクティア">
    <div class="press">TAP TO BEGIN<small>タップしてはじめる</small></div>
    <p class="sp-note">♪ 音が出ます</p>
  </div>
</section>

<!-- TITLE -->
<section class="scene" id="title" aria-label="タイトル画面">
  <div class="bgimg" style="background-image:url(img/g1.webp)"></div>
  <div class="vignette"></div>
  <div class="col">
    <p class="eyebrow">A NEW GAME</p>
    <h1 class="logo"><img src="img/logo_purple.webp" alt="selectear セレクティア"><img class="glitch g1" src="img/logo_purple.webp" alt=""><img class="glitch g2" src="img/logo_purple.webp" alt=""></h1>
    <img class="hero" src="img/g1.webp" alt="SELECTEAR 全員集合">
    <div class="press">TAP TO START<small>タップでスタート</small></div>
  </div>
  <button class="chip-btn r" type="button" id="titleBgmBtn" aria-pressed="true">♪ BGM オン</button>
  <div class="ver">PROTOTYPE 0.2</div>
</section>

<!-- HOME: 桐嗚 -->
<section class="scene sb" id="standby" aria-label="ホーム（風野 桐嗚）">
  <div class="stage" data-ratio="1.7778" data-focus="32" data-menu="71.2,53.6,25.2,4.6,1.3">
    <img src="img/home_kiritou.webp" alt="風野 桐嗚のホーム画面">
    <div class="spin" style="left:79.4%;top:36.2%;width:3.6%;aspect-ratio:1"></div>
    <div class="sbar" style="left:74.0%;top:47.6%;width:11.8%;height:1.4%"><i></i></div>
    <button class="hot" type="button" aria-label="風野 桐嗚に話しかける" style="left:14%;top:4%;width:44%;height:72%"></button>
  </div>
  <nav class="hmenu" aria-label="メニュー"></nav>
  <div class="talkhint">桐嗚をタップして話しかける</div>
  <button class="chip-btn l" type="button" data-swap="standby2">⇄ ホームを切り替え</button>
</section>

<!-- HOME: 実優 -->
<section class="scene sb sb2" id="standby2" aria-label="ホーム（実優）">
  <div class="stage" data-ratio="1.7778" data-focus="27" data-menu="66.3,55.3,18.8,5.2,0.8">
    <img src="img/home_miyu.webp" alt="実優のホーム画面">
    <button class="hot" type="button" aria-label="実優に話しかける" style="left:2%;top:4%;width:52%;height:92%"></button>
  </div>
  <nav class="hmenu" aria-label="メニュー"></nav>
  <div class="talkhint">実優をタップして話しかける</div>
  <button class="chip-btn l" type="button" data-swap="standby">⇄ ホームを切り替え</button>
  <button class="chip-btn l2" type="button" id="bgmBtn" aria-pressed="true">♪ BGM オン</button>
</section>

<!-- talk -->
<div class="talk" id="talk" role="dialog" aria-modal="true" aria-labelledby="talkName">
  <div class="shade"></div>
  <div class="choices" id="choices"></div>
  <div class="win" id="win" tabindex="0" aria-live="polite">
    <div class="tname" id="talkName">風野 桐嗚</div>
    <div class="ttext" id="ttext"></div>
    <div class="tnext" id="tnext">▼</div>
  </div>
</div>

<!-- panels -->
<div class="panel" id="p-newgame" role="dialog" aria-label="ニューゲーム">
  <div class="card-box center">
    <h3>NEW GAME</h3>
    <p class="soon">COMING SOON</p>
    <p class="small">本編は準備中です。もう少し待っててね。</p>
    <button class="xbtn" type="button" data-close>CLOSE</button>
  </div>
</div>
<div class="panel" id="p-shop" role="dialog" aria-label="ショップ">
  <div class="card-box center">
    <h3>SHOP</h3>
    <p class="soon">COMING SOON</p>
    <p class="small">ショップは準備中です。</p>
    <button class="xbtn" type="button" data-close>CLOSE</button>
  </div>
</div>
<div class="panel" id="p-config" role="dialog" aria-label="コンフィグ">
  <div class="card-box">
    <h3>CONFIG</h3>
    <div class="row"><span>BGM</span><button class="tog" type="button" id="tBgm">ON</button></div>
    <div class="row"><span>効果音</span><button class="tog" type="button" id="tSound">ON</button></div>
    <div class="row"><label for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="70"></div>
    <div class="row"><span>雨・光の演出</span><button class="tog" type="button" id="tFx">ON</button></div>
    <div class="row"><span>振動（対応端末のみ）</span><button class="tog" type="button" id="tVib">ON</button></div>
    <button class="xbtn" type="button" data-close>CLOSE</button>
  </div>
</div>
<div class="panel" id="p-option" role="dialog" aria-label="オプション">
  <div class="card-box">
    <h3>OPTION</h3>
    <div class="row"><span>ホーム画面</span><div class="seg"><button class="tog" type="button" data-home="standby">桐嗚</button><button class="tog" type="button" data-home="standby2">実優</button></div></div>
    <div class="row"><span>会話の文字送り</span><div class="seg"><button class="tog" type="button" data-speed="70">遅い</button><button class="tog" type="button" data-speed="40">普通</button><button class="tog" type="button" data-speed="15">速い</button></div></div>
    <div class="row"><span>設定を初期状態に戻す</span><button class="tog danger" type="button" id="reset">RESET</button></div>
    <button class="xbtn" type="button" data-close>CLOSE</button>
  </div>
</div>
<div class="panel" id="p-extra" role="dialog" aria-label="エクストラ">
  <div class="card-box">
    <h3>EXTRA</h3>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="gallery" aria-selected="true">ギャラリー</button>
      <button type="button" role="tab" data-tab="credits" aria-selected="false">クレジット</button>
    </div>

</div>
<div class="panel" id="p-confirm" role="dialog" aria-label="確認">
  <div class="card-box center">
    <h3 id="cfTitle">CONFIRM</h3>
    <p id="cfText" style="margin:0 0 16px"></p>
    <div class="btnrow"><button class="xbtn" type="button" id="cfNo">やめる</button><button class="xbtn" type="button" id="cfYes">OK</button></div>
  </div>
</div>
<div class="lightbox" id="lb" role="dialog" aria-label="画像表示">
  <img id="lbImg" src="" alt="SELECTEAR">
  <div class="btnrow"><button class="xbtn" type="button" id="lbPrev">◀ PREV</button><span class="small" id="lbCount"></span><button class="xbtn" type="button" id="lbNext">NEXT ▶</button></div>
  <button class="xbtn" type="button" id="lbClose">CLOSE</button>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";
  /* standalone build: assets embedded once in window.__ASSETS; the published version loads files */
  const ASSETS = window.__ASSETS || null;
  const A = p => (ASSETS && ASSETS[p]) || p;
  if (ASSETS) for (const el of document.querySelectorAll("[src], [style*='url(']")) {
    if (el.hasAttribute("src") && el.getAttribute("src")) el.setAttribute("src", A(el.getAttribute("src")));
    const s0 = el.getAttribute("style"); if (s0 && s0.includes("url(")) el.setAttribute("style", s0.replace(/url\((img\/[^)]+)\)/g, (m, q) => `url(${A(q)})`));
  }

  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  /* ---------- settings ---------- */
  const DEF = { bgm: true, sound: true, vol: 70, fx: true, vib: true, speed: 40 };
  let st = Object.assign({}, DEF, store.get("selectear_settings2", {}));
  const saveSt = () => store.set("selectear_settings2", st);

  /* ---------- audio ---------- */
  let ac = null, master = null;
  function audio() {
    try {
      if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); }
      master.gain.value = st.vol / 100; if (ac.state === "suspended") ac.resume(); return ac;
    } catch { return null; }
  }
  // looping music with fades; routed through Web Audio so the volume also works on iPhone
  function Track(src, level) {
    const el = new Audio(A(src)); el.loop = true; el.preload = "auto"; el.setAttribute("playsinline", "");
    let gain = null, on = false, t = 0;
    function route() { if (gain || !audio()) return; try { const s = ac.createMediaElementSource(el); gain = ac.createGain(); gain.gain.value = .0001; s.connect(gain).connect(master); } catch { gain = null; } }
    function fade(v, sec, then) {
      clearTimeout(t);
      if (gain) { const g = gain.gain, now = ac.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value, .0001), now); g.exponentialRampToValueAtTime(Math.max(v, .0001), now + sec); }
      else el.volume = Math.min(1, v * st.vol / 100);
      if (then) t = setTimeout(then, sec * 1000 + 50);
    }
    return {
      start() { if (on) return; on = true; route(); const p = el.play(); if (p && p.catch) p.catch(() => { on = false; }); fade(level, 1.2); },
      stop() { if (!on) return; on = false; fade(0, .6, () => { if (!on) el.pause(); }); },
      restart() { el.currentTime = 0; }
    };
  }
  const titleBGM = Track("title_bgm.mp3", .8);
  const miyuBGM = Track("miyu_bgm.mp3", .7);
  // the uploaded "決定" sound for menu buttons
  const seEl = new Audio(A("se_decide.mp3")); seEl.preload = "auto";
  function decide() { if (!st.sound) return; try { const a = seEl.cloneNode(); a.volume = Math.min(1, st.vol / 100); const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch {} }
  function tone(f, d, type = "square", v = .1, delay = 0) {
    if (!st.sound || !audio()) return;
    try { const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02); } catch {}
  }
  const sfx = { move: () => tone(1320, .05, "triangle", .08), back: () => { tone(784, .08, "triangle", .08); tone(523, .12, "triangle", .06, .06); }, type: () => tone(620 + Math.random() * 80, .03, "square", .025) };
  const buzz = ms => { if (st.vib) try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  function toast(t) { const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2000); }
  function flash() { const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }

  const SCENES = ["splash", "title", "standby", "standby2"];
  let scene = "splash";

  /* ---------- fx: rain + neon sparks ---------- */
  const cv = $("fx"), g = cv.getContext("2d"); let W = 0, H = 0;
  function rs() { const r = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; g.setTransform(r, 0, 0, r, 0, 0); }
  addEventListener("resize", rs); rs();
  const drops = Array.from({ length: 60 }, () => ({ x: Math.random() * 1400, y: Math.random() * 1000, l: 12 + Math.random() * 24, v: 9 + Math.random() * 9 }));
  let parts = [];
  const cols = ["#9b5cff", "#e6d4ff", "#4f8cff", "#ffffff"];
  const sp = (x, y, b) => { const a = Math.random() * 6.28, s = b ? 2 + Math.random() * 8 : .2 + Math.random() * .4; return { x: x ?? Math.random() * W, y: y ?? H + 10, vx: Math.cos(a) * s, vy: b ? Math.sin(a) * s : -.3 - Math.random() * .5, life: 1, dec: b ? .02 : .003, size: b ? 2 + Math.random() * 3 : 1 + Math.random() * 2, col: pick(cols), b }; };
  const burst = (x, y, n = 50) => { if (!reduce && st.fx) for (let i = 0; i < n; i++) parts.push(sp(x, y, true)); };
  (function tick() {
    g.clearRect(0, 0, W, H);
    if (st.fx && !reduce && scene !== "splash") {
      if (scene === "title") { g.lineWidth = 1; g.strokeStyle = "rgba(170,190,255,.22)"; for (const d of drops) { d.y += d.v; d.x -= 1.2; if (d.y > H) { d.y = -30; d.x = Math.random() * (W + 80); } g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x - 2, d.y + d.l); g.stroke(); } }
      while (parts.filter(p => !p.b).length < 26) parts.push(sp(undefined, Math.random() * H));
    } else parts = parts.filter(p => p.b);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; if (p.b) p.vy += .15; p.life -= p.dec; g.globalAlpha = Math.max(0, p.life) * (p.b ? 1 : .55); g.fillStyle = p.col; g.beginPath(); g.moveTo(p.x, p.y - p.size * 2); g.lineTo(p.x + p.size * .6, p.y); g.lineTo(p.x, p.y + p.size * 2); g.lineTo(p.x - p.size * .6, p.y); g.fill(); }
    g.globalAlpha = 1; parts = parts.filter(p => p.life > 0 && p.y > -20);
    requestAnimationFrame(tick);
  })();

  /* ---------- scenes + music ---------- */
  let home = store.get("selectear_home", "standby") === "standby2" ? "standby2" : "standby";
  function show(id) { for (const s of SCENES) $(s).classList.toggle("on", s === id); scene = id; if (id === "standby" || id === "standby2") fit(); syncMusic(); }
  function syncMusic() {
    const hidden = document.hidden;
    if (st.bgm && scene === "title" && !hidden) titleBGM.start(); else titleBGM.stop();
    if (st.bgm && scene === "standby2" && !hidden) miyuBGM.start(); else miyuBGM.stop();
    for (const b of [$("titleBgmBtn"), $("bgmBtn")]) { b.textContent = st.bgm ? "♪ BGM オン" : "♪ BGM オフ"; b.setAttribute("aria-pressed", String(st.bgm)); }
  }
  document.addEventListener("visibilitychange", syncMusic);
  for (const b of [$("titleBgmBtn"), $("bgmBtn")]) b.addEventListener("click", e => { e.stopPropagation(); audio(); st.bgm = !st.bgm; saveSt(); paintSettings(); syncMusic(); });

  // splash -> title (this tap unlocks audio, so the title music can start)
  $("splash").addEventListener("click", () => { audio(); decide(); show("title"); });
  // title -> home
  let leaving = false;
  $("title").addEventListener("click", e => {
    if (leaving) return; leaving = true; audio(); decide(); buzz(30); flash(); burst(e.clientX, e.clientY, 60);
    if (home === "standby2" && st.bgm) miyuBGM.start(); // start inside the tap (iPhone)
    setTimeout(() => { show(home); leaving = false; }, reduce ? 0 : 350);
  });

  /* ---------- home pictures cover the screen; menu sits over the picture's own menu area ---------- */
  const MENU = [
    ["newgame", "New Game", true], ["shop", "Shop"], ["extra", "Extra"], ["config", "Config"], ["option", "Option"], ["exit", "Exit"]
  ];
  for (const nav of document.querySelectorAll(".hmenu")) {
    for (const [act, label, primary] of MENU) {
      const b = document.createElement("button"); b.type = "button"; b.className = "mb" + (primary ? " primary" : ""); b.dataset.act = act;
      b.innerHTML = `<span>${label}</span>`; nav.append(b);
    }
  }
  function fit() {
    const Wd = innerWidth, Hd = innerHeight;
    for (const sec of document.querySelectorAll(".sb")) {
      const s = sec.querySelector(".stage");
      const r = +s.dataset.ratio, f = +s.dataset.focus / 100;
      let w = Wd, h = Wd / r; if (h < Hd) { h = Hd; w = Hd * r; }
      s.style.width = w + "px"; s.style.height = h + "px";
      const left = Math.min(0, Math.max(-(w - Wd), Wd / 2 - w * f));
      s.style.setProperty("--tx", (left - Wd / 2) + "px");
      // menu box in % of the picture: left, top, width, button height, gap
      const [ml, mt, mw, mh, mg] = s.dataset.menu.split(",").map(Number);
      const x0 = left + w * ml / 100, y0 = (Hd - h) / 2 + h * mt / 100, bw = w * mw / 100, bh = h * mh / 100;
      const narrow = x0 < 0 || x0 + bw > Wd || bh < 30 || Wd / Hd < 1.15;
      sec.classList.toggle("narrow", narrow);
      const nav = sec.querySelector(".hmenu");
      if (narrow) for (const k of ["--l", "--t", "--w", "--bh", "--gap"]) nav.style.removeProperty(k);
      else { nav.style.setProperty("--l", x0 + "px"); nav.style.setProperty("--t", y0 + "px"); nav.style.setProperty("--w", bw + "px"); nav.style.setProperty("--bh", bh + "px"); nav.style.setProperty("--gap", (h * mg / 100) + "px"); }
    }
  }
  addEventListener("resize", fit);

  for (const b of document.querySelectorAll("[data-swap]")) b.addEventListener("click", e => {
    e.stopPropagation(); closeTalk(); sfx.move(); setHome(b.dataset.swap);
  });
  function setHome(id) { home = id; store.set("selectear_home", home); if (scene === "standby" || scene === "standby2") show(home); paintSettings(); }

  /* menu actions */
  for (const b of document.querySelectorAll(".hmenu .mb")) b.addEventListener("click", e => {
    e.stopPropagation(); audio(); decide(); buzz(15); closeTalk();
    const a = b.dataset.act;
    if (a === "newgame") openPanel("p-newgame");
    else if (a === "shop") openPanel("p-shop");
    else if (a === "extra") { renderExtra("gallery"); openPanel("p-extra"); }
    else if (a === "config") openPanel("p-config");
    else if (a === "option") openPanel("p-option");
    else if (a === "exit") confirmBox("EXIT", "タイトル画面に戻りますか？", () => { titleBGM.restart(); show("title"); });
  });

  /* panels */
  const openPanel = id => $(id).classList.add("on");
  function closePanels() { for (const p of document.querySelectorAll(".panel.on, .lightbox.on")) p.classList.remove("on"); }
  for (const b of document.querySelectorAll("[data-close]")) b.addEventListener("click", () => { sfx.back(); closePanels(); });
  for (const p of document.querySelectorAll(".panel")) p.addEventListener("click", e => { if (e.target === p && p.id !== "p-confirm") { sfx.back(); p.classList.remove("on"); } });
  function confirmBox(title, text, yes) {
    $("cfTitle").textContent = title; $("cfText").textContent = text; openPanel("p-confirm");
    $("cfYes").onclick = () => { decide(); $("p-confirm").classList.remove("on"); yes(); };
    $("cfNo").onclick = () => { sfx.back(); $("p-confirm").classList.remove("on"); };
  }

  /* config + option */
  const TOG = [["tBgm", "bgm"], ["tSound", "sound"], ["tFx", "fx"], ["tVib", "vib"]];
  function paintSettings() {
    for (const [id, k] of TOG) { const el = $(id); el.textContent = st[k] ? "ON" : "OFF"; el.classList.toggle("on", !!st[k]); el.setAttribute("aria-pressed", String(!!st[k])); }
    $("vol").value = st.vol;
    for (const b of document.querySelectorAll("[data-home]")) b.classList.toggle("on", b.dataset.home === home);
    for (const b of document.querySelectorAll("[data-speed]")) b.classList.toggle("on", +b.dataset.speed === st.speed);
  }
  for (const [id, k] of TOG) $(id).addEventListener("click", () => { st[k] = !st[k]; saveSt(); paintSettings(); decide(); if (k === "bgm") syncMusic(); });
  $("vol").addEventListener("input", () => { st.vol = +$("vol").value; saveSt(); if (master) master.gain.value = st.vol / 100; });
  $("vol").addEventListener("change", decide);
  for (const b of document.querySelectorAll("[data-home]")) b.addEventListener("click", () => { decide(); setHome(b.dataset.home); });
  for (const b of document.querySelectorAll("[data-speed]")) b.addEventListener("click", () => { st.speed = +b.dataset.speed; saveSt(); paintSettings(); decide(); });
  $("reset").addEventListener("click", () => confirmBox("RESET", "音量や演出などの設定を初期状態に戻します。", () => { st = Object.assign({}, DEF); saveSt(); paintSettings(); syncMusic(); if (master) master.gain.value = st.vol / 100; toast("設定を初期状態に戻しました"); }));
  paintSettings();

  /* extra: gallery + credits */
  const GALLERY = [A("img/g1.webp"), A("img/g2.webp"), A("img/g3.webp"), A("img/g4.webp"), A("img/g5.webp"), A("img/g6.webp"), A("img/g7.webp"), A("img/home_title.webp"), A("img/home_kiritou.webp"), A("img/home_miyu.webp")];
  for (const t of document.querySelectorAll("[data-tab]")) t.addEventListener("click", () => { sfx.move(); renderExtra(t.dataset.tab); });
  function renderExtra(tab) {
    for (const t of document.querySelectorAll("[data-tab]")) t.setAttribute("aria-selected", String(t.dataset.tab === tab));
    const body = $("extraBody");
    if (tab === "gallery") {
      body.innerHTML = `<div class="grid3">${GALLERY.map((s, i) => `<button class="thumb" type="button" data-g="${i}" aria-label="画像 ${i + 1}"><img src="${s}" alt="" loading="lazy"></button>`).join("")}</div>`;
      for (const b of body.querySelectorAll("[data-g]")) b.addEventListener("click", () => { decide(); openLb(+b.dataset.g); });
    } else {
      body.innerHTML = `<div class="credit"><p><b>SELECTEAR</b></p><p class="small">PRESENTED BY</p><p><b>LIGNA CLEAN SERVICE</b></p><p>代表 平林 頼生</p><p class="small">MUSIC — Counter Attack（タイトル）</p><p class="small">PROTOTYPE 0.2 — 続きは本編で。</p><p><a href="https://claude.ai/artifact/Wfsk43yUGPGrgXSztNGqXj" target="_blank" rel="noopener">LIGNA ホームページへ</a></p></div>`;
    }
  }
  let gi = 0;
  function openLb(i) { gi = (i + GALLERY.length) % GALLERY.length; $("lbImg").src = GALLERY[gi]; $("lbCount").textContent = `${gi + 1} / ${GALLERY.length}`; $("lb").classList.add("on"); }
  $("lbPrev").addEventListener("click", () => { sfx.move(); openLb(gi - 1); });
  $("lbNext").addEventListener("click", () => { sfx.move(); openLb(gi + 1); });
  $("lbClose").addEventListener("click", () => { sfx.back(); $("lb").classList.remove("on"); });

  /* ---------- talk ---------- */
  const GREET = [
    ["お、来た来た！", "待ってたんだよ〜！ねえ今日なにする？ガチャ？ガチャだよね？"],
    ["……あ、ごめん。ちょっとぼーっとしてた。", "人といるのも好きだけど、たまには一人でいたくなるんだよね。……でも来てくれてうれしい。"],
    ["聞いて聞いて！", "さっき新作のパフェ見つけてさ！もう最高だった……！", "あ、ゲームの話だった？ごめんごめん笑"],
    ["うわ〜〜〜昨日のガチャ全部Cだったんだけど！！", "……まあいっか！今日はいける気がする！"],
    ["やっほー。", "予定？決めてないよ。決めない方が楽しくない？"]
  ];
  const TOPICS = {
    "今日の運勢": () => { const r = Math.random(); const tier = r < .1 ? ["……え、大吉！？", "やばいやばい！今日Sランク来るって！！絶対来る！！"] : r < .45 ? ["吉！", "いいじゃんいいじゃん、Aくらいなら全然あるよ！"] : r < .8 ? ["小吉〜。", "Bでも勝てばいいんだよ、勝てば！楽しんだもん勝ち！"] : ["…………凶。", "うそでしょ……", "いや、逆に燃えてきた。Cで勝ったらかっこよくない？"]; return ["よーし、占っちゃお！", ...tier]; },
    "おすすめのキャラ": () => pick([["麗皇！", "全然倒れないの。半分の確率で生き返るとかずるくない？笑"], ["星南はね〜……", "仲間がやられるほど強くなるの。ちょっと切ないけど、そこがいい。"], ["チョウ・ヤン！", "顔こわいけど、めっちゃ頼りになるよ。……たぶん優しい。たぶん。"], ["結菜ちゃん！", "回復してくれるし、推しにはとことん甘いの。わかる〜ってなる。"], ["遠藤くん！", "透明になって後ろから！みたいなの、ロマンあるよね〜！"], ["え、俺？", "イカサマと無敵の人！最後に全部ひっくり返すの、気持ちいいよ〜！"]]),
    "ゲームのコツ": () => pick([["使わなかった◆は、次のターンに持ち越せるんだよ。", "貯金ってわくわくしない？一気にドーンって使うの最高！"], ["abilityは全部、勝手に発動するの！", "だから誰と組むかが大事。相性って人間関係みたいだよね〜。"], ["手番はHPの低い順に回ってくるよ。", "やられてる方が先に動ける！逆転のチャンスってこと！"], ["琉海は怒らせないほうがいいよ……", "3回殴られたら、ほんとに黙ってないから。こわいこわい。"]]),
    "甘いもの": () => pick([["甘いもの！？", "パフェ、クレープ、マカロン……あ〜〜全部食べたい！"], ["試合に勝ったらさ、", "ケーキ食べに行こ！勝たなくても行くけど！笑"], ["疲れたときは糖分だよ、糖分。", "頭使うゲームだからね。……って言い訳してまた食べちゃう。"]]),
    "またね": null
  };
  const GREET2 = [
    ["あっ！来た来た〜！！", "うち、ずっと待ってたんだからね！？ほら早く早く、遊ぼ！"],
    ["やっほー！実優だよ〜！", "今日も元気いっぱい！……え、うちいつも元気だって？えへへ〜♪"],
    ["ちょっと待って、今いいとこ！", "……よし、写真撮れた！見て見て、この月めっちゃエモくない！？"],
    ["おはよ〜……じゃなかった、こんばんは！", "時間とか気にしないの！楽しい時間がいちばん大事！"],
    ["ねぇねぇ！", "うちのこと、ちゃんと引いてくれる？……約束だよ！"]
  ];
  const TOPICS2 = {
    "今日の運勢": () => { const r = Math.random(); const tier = r < .1 ? ["……大吉ぃぃぃ！！", "やばいやばい、今日のキミ最強じゃん！Sランク確定〜！"] : r < .45 ? ["吉！やったね！", "Aランク来るかも！うちの勘、けっこう当たるんだから！"] : r < .8 ? ["小吉〜！", "ちょうどいいくらい！あとはキミの腕しだいっ！"] : ["……凶。", "え、待って、もう1回！今のナシ！……だめ？", "じゃあうちが運、分けてあげる！はいっ！"]; return ["うちが占ってあげる！えいっ！", ...tier]; },
    "おすすめのキャラ": () => pick([["桐嗚くん！", "ふわふわしてるけど、最後にぜーんぶひっくり返すの。かっこいいよね〜！"], ["麗皇くん！", "倒れないんだよ！？半分の確率で！うちもあれ欲しい〜！"], ["結菜ちゃん！", "回復してくれるんだよ〜。優しい！好き！"], ["チョウ・ヤン……さん。", "ちょっとこわいけど、味方だとすっごく頼もしいの！"], ["琉海ちゃん！", "怒らせなければ天使！怒らせたら……うん、逃げよ！"], ["もちろん、うち！", "……え、まだ実装されてない？じゃあ待っててね！"]]),
    "ゲームのコツ": () => pick([["◆は貯金できるんだよ！", "うちはすぐ使っちゃうタイプだけど……キミは計画的にね！"], ["abilityは全部、自動で出るの！", "だから、誰と誰を組ませるかがいちばん大事！友達選びと一緒だね！"], ["HPが低い人から順番が来るよ！", "ピンチはチャンス！ってやつ！"], ["負けてもいいの！", "楽しかったら勝ち！……でもやっぱ勝ちたい！！"]]),
    "スマホ見せて": () => pick([["いいよ〜！ほら！", "これ昨日撮った夜景！キラキラしてるでしょ〜！"], ["えへへ、待ち受け見る？", "……やっぱ秘密っ！恥ずかしいもん！"], ["今ね、みんなでグループ通話してたの！", "キミも入る？うちが招待しとくね！"]]),
    "またね": null
  };
  let T = TOPICS, BYE = [], lines = [], li = 0, typing = false, full = "", timer = 0, talking = false, after = null;
  function openTalk() {
    if (talking) return; talking = true; for (const h of document.querySelectorAll(".talkhint")) h.hidden = true;
    const pink = scene === "standby2"; $("talk").classList.toggle("pink", pink); $("talkName").textContent = pink ? "実優" : "風野 桐嗚";
    T = pink ? TOPICS2 : TOPICS;
    BYE = pink ? ["えーっ！もう行っちゃうの！？", "……しょうがないなぁ。次はもっといっぱい遊ぼうね！ばいばーい！"] : ["えー、もう行っちゃうの？", "……うん、また遊ぼ！絶対ね！"];
    $("talk").classList.add("on"); audio(); tone(880, .08, "sine", .08); tone(1320, .12, "sine", .06, .06);
    say(pick(pink ? GREET2 : GREET), showChoices);
  }
  function closeTalk() { talking = false; $("talk").classList.remove("on"); $("choices").replaceChildren(); for (const h of document.querySelectorAll(".talkhint")) h.hidden = false; clearInterval(timer); }
  function say(arr, then) { lines = arr; li = 0; after = then; $("choices").replaceChildren(); typeLine(); }
  function typeLine() {
    full = lines[li]; const el = $("ttext"); el.textContent = ""; $("tnext").hidden = true; typing = true; let k = 0; clearInterval(timer);
    if (reduce) { el.textContent = full; typing = false; $("tnext").hidden = false; return; }
    timer = setInterval(() => { el.textContent = full.slice(0, ++k); if (k % 2) sfx.type(); if (k >= full.length) { clearInterval(timer); typing = false; $("tnext").hidden = false; } }, st.speed);
  }
  function advance() {
    if (!talking) return;
    if (typing) { clearInterval(timer); $("ttext").textContent = full; typing = false; $("tnext").hidden = false; return; }
    if ($("choices").children.length) return;
    if (li < lines.length - 1) { li++; typeLine(); return; }
    after && after();
  }
  function showChoices() {
    $("tnext").hidden = true; const box = $("choices"); box.replaceChildren();
    for (const k of Object.keys(T)) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k;
      b.onclick = e => { e.stopPropagation(); sfx.move(); box.replaceChildren(); if (!T[k]) { say(BYE, closeTalk); return; } say(T[k](), showChoices); };
      box.append(b);
    }
    box.firstChild.focus();
  }
  for (const h of document.querySelectorAll(".hot")) h.addEventListener("click", e => { e.stopPropagation(); openTalk(); });
  $("win").addEventListener("click", advance);
  $("talk").addEventListener("click", e => { if (e.target.classList.contains("shade")) advance(); });

  /* keyboard */
  addEventListener("keydown", e => {
    if (e.key === "Escape") { if (talking) closeTalk(); else closePanels(); return; }
    if ((scene === "splash" || scene === "title") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $(scene).click(); return; }
    if (talking && (e.key === "Enter" || e.key === " ") && !$("choices").children.length) { e.preventDefault(); advance(); }
  });
})();
</script>
