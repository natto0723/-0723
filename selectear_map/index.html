<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SELECTEAR City Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* NEON RUIN CITY — the outside world, drawn as a 2D tactical map (spec: 「NEON RUIN CITY マップデザイン説明書」).
   7 cities of the seven deadly sins sit round GROUND ZERO like a clock face turned 90°: 1 怠惰 on the right, then clockwise.
   アジト is next to 怠惰. Single dark neon look, same tokens and buttons as the home and hideout pages. */
:root {
  --bg: #05040b;
  --panel: rgba(12, 9, 24, .96);
  --ink: #f1efff;
  --dim: #a7a2c6;
  --violet: #9b5cff;
  --blue: #4f8cff;
  --ice: #d9e6ff;
  --gold: #f2c14e;
  --cyan: #48e1ff;
  --red: #ff4d5e;
  --line: rgba(150, 120, 255, .45);
  --font-latin: "Cinzel", "Times New Roman", serif;
  --font-menu: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-num: "Chakra Petch", "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-touch-callout: none; }
button, a { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.scene { position: fixed; inset: 0; display: none; overflow: hidden; }
.scene.on { display: block; animation: sceneIn .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes sceneIn { from { opacity: 0; } }
@keyframes blink { 50% { opacity: .3; } }
.flash { position: fixed; inset: 0; z-index: 90; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; padding: 10px 16px; border-radius: 12px; background: rgba(10, 8, 16, .95); border: 1px solid var(--violet); font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

/* ---------- START ---------- */
#start { background: radial-gradient(ellipse at 50% 60%, #1a0d33 0%, #07050c 70%); }
#start .bg { position: absolute; inset: -30px; background: url(img/map.webp) center / cover; filter: blur(14px) brightness(.35) saturate(1.3); }
#start .col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.logo { width: min(480px, 84vw);  filter: drop-shadow(0 0 18px rgba(155, 92, 255, .55)); }
.eyebrow { margin: 0; font: 600 12px var(--font-latin); letter-spacing: .45em; padding-left: .45em; color: var(--dim); }
.note { margin: 0; font-size: 12px; color: var(--dim); }
.mb { --k: 165, 110, 255; position: relative; height: 64px; width: min(320px, 80vw); border: 0; padding: 0 14% 0 16%; background: none; cursor: pointer; display: flex; align-items: center; gap: 12px; text-align: left; color: #f6ecff; text-decoration: none; }
.mb::before { content: ""; position: absolute; inset: 0; transform: skewX(-18deg); border: 1.5px solid #fff; border-radius: 4px; background: linear-gradient(90deg, rgba(var(--k), .6), rgba(var(--k), .25) 60%, rgba(20, 8, 36, .8)); box-shadow: 0 0 22px rgba(var(--k), .85), inset 0 0 18px rgba(255, 255, 255, .2); }
.mb > * { position: relative; }
.mb svg { width: 26px; height: 26px; flex: none; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linejoin: round; }
.mb .en { display: block; font: 700 26px/1 var(--font-menu); letter-spacing: .08em; text-shadow: 0 0 8px rgba(var(--k), .8); }
.mb .jp { display: block; margin-top: 3px; font: 700 12px/1 var(--font-body); color: rgba(255, 255, 255, .75); letter-spacing: .12em; }
.mb.pulse::before { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 36px rgba(var(--k), 1), inset 0 0 22px rgba(255, 255, 255, .3); } }

/* ---------- top bar ---------- */
.topbar { position: absolute; z-index: 10; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(5, 3, 12, .9), transparent); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.back, .snd, .zb { border: 1px solid rgba(201, 198, 214, .45); background: rgba(8, 5, 18, .8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); cursor: pointer; }
.back { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 10px; border-radius: 12px; font: 700 13px var(--font-body); }
.back svg, .snd svg, .zb svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.place { text-align: center; min-width: 0; }
.place b { display: block; font: 800 clamp(13px, 3.4vw, 17px)/1.1 var(--font-latin); letter-spacing: .22em; color: var(--ice); text-shadow: 0 0 10px rgba(155, 92, 255, .8); white-space: nowrap; }
.place small { display: block; margin-top: 3px; font: 700 11px var(--font-body); color: var(--dim); letter-spacing: .15em; }
.right { display: flex; align-items: center; gap: 8px; }
.snd { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; padding: 0; }
.snd .off { display: none; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="false"] .off { display: inline; }
.coins { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px 0 10px; border-radius: 999px; background: rgba(8, 5, 18, .8); border: 1px solid rgba(242, 193, 78, .55); }
.coin-ic { width: 20px; height: 20px; flex: none; background: linear-gradient(135deg, #fff6d0, var(--gold) 45%, #b9801a); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); filter: drop-shadow(0 0 4px var(--gold)); }
.coins .lb { font: 700 10px/1.1 var(--font-body); color: var(--dim); }
.coins .val { font: 700 17px/1 var(--font-num); color: #fff; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .coins .lb, .back span, .place small { display: none; } .back { padding: 0 10px; } }

/* ---------- MAP: one big city in front, its neighbours behind (3D carousel on the sea) ---------- */
#map { background: #03020a; }
canvas#water { position: absolute; inset: 0; width: 100%; height: 100%; }
#map .fog { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(3, 2, 10, .7) 0%, transparent 14%), radial-gradient(ellipse at 50% 55%, transparent 50%, rgba(3, 2, 10, .6) 100%); }
.stage { position: absolute; left: 0; right: 0; top: calc(58px + env(safe-area-inset-top, 0px)); bottom: var(--foot, 190px); perspective: 1400px; touch-action: pan-y; cursor: grab; overflow: hidden; }
.stage.drag { cursor: grabbing; }
.ci { position: absolute; left: 50%; top: 50%; width: var(--fw); margin-left: calc(var(--fw) / -2); border: 0; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.25, .9, .25, 1), opacity .7s, filter .7s; will-change: transform; }
.ci .float { display: block; position: relative; animation: bob 6s ease-in-out infinite; animation-delay: var(--d); }
@keyframes bob { 50% { transform: translateY(-8px); } }
.ci .art { position: relative; z-index: 2; display: block; }
.ci .art img, .ci .art svg { display: block; width: 100%; height: auto; }
.ci.pic .art > img:first-child { filter: drop-shadow(0 0 10px var(--c)) drop-shadow(0 14px 18px rgba(0, 0, 0, .85)) brightness(.82); }
/* neon: the city's lights sit on their own layers and flicker on and off */
.ci .art .lt { position: absolute; left: 0; top: 0; width: 100%; height: auto; mix-blend-mode: screen; opacity: .6; pointer-events: none; }
.ci .art .lt.la { animation: neonA var(--na, 4.3s) linear infinite; animation-delay: var(--nd, 0s); }
.ci .art .lt.lb { animation: neonB var(--nb, 5.9s) linear infinite; animation-delay: calc(var(--nd, 0s) * 1.7 - 1.3s); }
.ci.front .art .lt { filter: brightness(1.35) saturate(1.2); }
.ci.front.pic .art > img:first-child { animation: glow 3.4s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 22px var(--c)) drop-shadow(0 14px 18px rgba(0, 0, 0, .85)) brightness(.95); } }
@keyframes neonA { 0% { opacity: .25; } 6% { opacity: 1; } 7% { opacity: .15; } 8% { opacity: 1; } 40% { opacity: .9; } 55% { opacity: .35; } 70% { opacity: 1; } 71% { opacity: .2; } 72.5% { opacity: 1; } 100% { opacity: .25; } }
@keyframes neonB { 0% { opacity: 1; } 22% { opacity: .85; } 23% { opacity: .1; } 24% { opacity: .95; } 25.5% { opacity: .2; } 27% { opacity: 1; } 60% { opacity: .3; } 80% { opacity: 1; } 100% { opacity: 1; } }
.ci.locked .art .lt { display: none; }
.ci .seal { position: absolute; left: -2%; top: -4%; width: 104%; height: auto; pointer-events: none; animation: noise 2.6s steps(1) infinite; }
.ci .art svg { overflow: visible; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--c) 70%, transparent)) drop-shadow(0 12px 16px rgba(0, 0, 0, .85)); }
.ci .refl { position: absolute; left: 0; right: 0; top: 76%; z-index: 1; transform: scaleY(-.5); transform-origin: top; opacity: .3; filter: blur(2.5px) saturate(1.3); -webkit-mask-image: linear-gradient(0deg, rgba(0, 0, 0, .9), transparent 70%); mask-image: linear-gradient(0deg, rgba(0, 0, 0, .9), transparent 70%); pointer-events: none; }
.ci .refl img, .ci .refl svg { display: block; width: 100%; height: auto; }
.ci .glow { position: absolute; z-index: 0; left: 8%; right: 8%; top: 56%; aspect-ratio: 4 / 1; border-radius: 50%; background: radial-gradient(ellipse, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%); pointer-events: none; }
.ci .ripple { position: absolute; z-index: 0; left: 4%; right: 4%; top: 56%; aspect-ratio: 4 / 1; border-radius: 50%; border: 2px solid var(--c); opacity: 0; pointer-events: none; }
.ci.front .ripple { animation: ripple 3.2s ease-out infinite; }
@keyframes ripple { 0% { opacity: .6; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.25); } }
.ci .tag { position: absolute; z-index: 3; left: 50%; bottom: 4%; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: rgba(6, 4, 16, .88); border: 1px solid var(--c); font: 700 13px var(--font-body); white-space: nowrap; color: #fff; transition: opacity .4s; }
.ci.front .tag { opacity: 0; }
.ci.locked .art, .ci.locked .refl { filter: grayscale(.9) brightness(.5); }
.ci.locked.front .art, .ci.locked.front .refl { filter: grayscale(.55) brightness(.85); }
.ci.locked .glow { opacity: .3; }
.ci:focus-visible { outline: none; }
.ci:focus-visible .art { outline: 2px solid #fff; outline-offset: 4px; border-radius: 12px; }
.arrow { position: absolute; z-index: 9; top: calc(50% - 10px); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); background: rgba(8, 5, 18, .75); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: center; cursor: pointer; padding: 0; }
.arrow svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.arrow.l { left: max(12px, env(safe-area-inset-left, 0px)); }
.arrow.r { right: max(12px, env(safe-area-inset-right, 0px)); }
.arrow:hover { border-color: #fff; }
/* the selected city's name card and actions */
.foot { position: absolute; z-index: 9; left: 0; right: 0; bottom: 0; padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); display: grid; justify-items: center; gap: 10px; background: linear-gradient(0deg, rgba(3, 2, 10, .95) 40%, transparent); }
.title-card { text-align: center; display: grid; gap: 4px; justify-items: center; }
.title-card .eyebrow2 { font: 700 11px var(--font-num); letter-spacing: .25em; color: var(--cc, var(--ice)); }
.title-card h2 { margin: 0; font: 900 clamp(24px, 6vw, 40px)/1.1 var(--font-body); letter-spacing: .04em; text-shadow: 0 0 18px var(--cc, var(--violet)); }
.title-card .sub { font: 700 13px var(--font-body); color: var(--ice); }
.chip { display: inline-block; padding: 3px 12px; border-radius: 999px; font: 700 11px var(--font-body); border: 1px solid; }
.chip.locked { color: var(--dim); border-color: rgba(201, 198, 214, .4); }
.chip.open { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 30%, transparent); }
.chip.cleared { color: #0b0716; background: var(--cc); border-color: var(--cc); }
.acts { display: flex; gap: 8px; width: min(520px, 100%); }
.acts button { flex: 1; height: 48px; border-radius: 12px; font: 800 14px var(--font-body); cursor: pointer; border: 1px solid #fff; background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 70%, transparent), color-mix(in srgb, var(--cc) 25%, transparent)); box-shadow: 0 0 16px color-mix(in srgb, var(--cc) 50%, transparent); }
.acts button.sec { flex: .6; border-color: rgba(201, 198, 214, .45); background: rgba(8, 5, 18, .8); box-shadow: none; }
.acts button:disabled { opacity: .45; cursor: default; box-shadow: none; }
.dots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.dots button { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 1.5px solid rgba(200, 190, 240, .4); background: #14102a; color: var(--dim); font: 700 12px var(--font-num); cursor: pointer; }
.dots button.open { border-color: var(--c); color: #fff; }
.dots button.cleared { background: var(--c); border-color: var(--c); color: #0b0716; }
.dots button.sel { outline: 2px solid #fff; outline-offset: 2px; }
.dots .sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .2); margin: 0 2px; }
.dots .pill { width: auto; padding: 0 12px; border-radius: 999px; font: 700 11px var(--font-body); }
.dots .pill.gz { border-color: #ff4d5e; color: #ffc0c8; }
.dots .pill.gz.open { border-color: #c25cff; color: #fff; background: rgba(194, 92, 255, .3); }
.dots .pill.home { border-color: #fff; color: #fff; background: linear-gradient(90deg, rgba(155, 92, 255, .7), rgba(8, 5, 18, .9)); }
.dots .pill.sel { outline: 2px solid #fff; outline-offset: 2px; }
.swirl { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.barrier { animation: noise 2.6s steps(1) infinite; }
@keyframes noise { 0%, 100% { opacity: .95; } 31% { opacity: .5; } 33% { opacity: .95; } 62% { opacity: .7; } 64% { opacity: .95; } }
.reset { position: absolute; z-index: 9; left: max(10px, env(safe-area-inset-left, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(201, 198, 214, .3); background: rgba(8, 5, 18, .7); color: var(--dim); font: 700 10px var(--font-body); cursor: pointer; }
@media (max-width: 600px) { .arrow { width: 40px; height: 40px; } .dots { gap: 5px; } .dots button { width: 26px; height: 26px; font-size: 11px; } .dots .pill { padding: 0 9px; font-size: 10px; } .acts button { height: 44px; font-size: 13px; } }
@media (max-height: 520px) { .title-card .sub, .title-card .eyebrow2 { display: none; } .title-card h2 { font-size: 20px; } .foot { gap: 6px; } .acts button { height: 38px; } .dots button { width: 24px; height: 24px; } .stage { top: calc(50px + env(safe-area-inset-top, 0px)); } .reset { display: none; } }
/* ---------- OVERVIEW ---------- */
#overview { background: #05040b; }
.ov-sea { position: absolute; inset: -20px; background: url(img/sea.webp) center / cover; filter: brightness(.8); animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(-14px, 8px) scale(1.04); } }
.ov-wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#overview.pan { touch-action: pan-y; cursor: grab; }
#overview.pan .ov-hint { display: block; left: 50%; right: auto; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; }
.ov-wrap.fly { transition: transform .8s cubic-bezier(.5, 0, .2, 1), opacity .8s; }
.ov-wrap img { display: block; width: 100%; height: 100%; -webkit-user-drag: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%); mask-composite: intersect; }
.hs { position: absolute; transform: translate(-50%, -50%); border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 50%; }
/* islands: the art itself is never tinted or glowed. State is shown with HUD corner brackets and the name plate,
   and the touched island is picked out by dimming everything around it (a spotlight). */
.hs .br { position: absolute; inset: 4% 2% 14%; pointer-events: none; --bc: rgba(200, 190, 240, .45); --bl: 16px;
  background:
    linear-gradient(var(--bc), var(--bc)) left top / var(--bl) 2px, linear-gradient(var(--bc), var(--bc)) left top / 2px var(--bl),
    linear-gradient(var(--bc), var(--bc)) right top / var(--bl) 2px, linear-gradient(var(--bc), var(--bc)) right top / 2px var(--bl),
    linear-gradient(var(--bc), var(--bc)) left bottom / var(--bl) 2px, linear-gradient(var(--bc), var(--bc)) left bottom / 2px var(--bl),
    linear-gradient(var(--bc), var(--bc)) right bottom / var(--bl) 2px, linear-gradient(var(--bc), var(--bc)) right bottom / 2px var(--bl);
  background-repeat: no-repeat; opacity: .75; transition: inset .3s, opacity .3s; }
.hs.cleared .br { --bc: #f2c14e; opacity: .95; }
.hs.open .br { --bc: var(--c); opacity: 1; animation: lockOn 2.2s ease-in-out infinite; animation-delay: var(--dl); }
@keyframes lockOn { 0%, 100% { inset: 4% 2% 14%; } 50% { inset: 0% -2% 10%; } }
.hs.locked .br { --bl: 10px; opacity: .45; }
.hs:hover .br, .hs:focus-visible .br { --bc: #fff; --bl: 22px; inset: -2% -4% 8%; opacity: 1; animation: none; }
.ov-spot { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(ellipse var(--sw, 20%) var(--sh, 20%) at var(--sx, 50%) var(--sy, 50%), transparent 0%, transparent 70%, rgba(3, 2, 10, .62) 100%); }
.ov-spot.on { opacity: 1; }
.ov-spot { -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%), linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%); mask-composite: intersect; }
.hs .lbl .mk { margin-left: 6px; padding: 1px 6px; border-radius: 3px; font: 700 .72em/1.4 var(--font-num); letter-spacing: .12em; background: #f2c14e; color: #2a1600; }
.hs .lbl .mk.nx { background: transparent; color: var(--c); border: 1px solid var(--c); }
.hs .lbl .mk.lk { background: transparent; color: #a7a2c6; border: 1px solid rgba(200, 190, 240, .35); }
.hs .lbl .st { color: #f2c14e; margin-right: 4px; }
.hs.cleared .lbl { border-color: #f2c14e; }
/* drifting fog that hides the picture's edges */
.ov-fog { position: absolute; inset: -12% -8%; pointer-events: none; z-index: 2; }
.ov-fog i { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(78, 70, 100, .7) 0%, rgba(44, 38, 66, .45) 42%, transparent 70%); filter: blur(16px); animation: fogMove var(--t, 30s) ease-in-out infinite alternate; animation-delay: var(--d0, 0s); }
@keyframes fogMove { from { transform: translate(var(--fx0, 0), var(--fy0, 0)) scale(1); } to { transform: translate(var(--fx1, 30px), var(--fy1, -10px)) scale(1.12); } }
.ov-wrap .rim { display: none; }
.hs:focus-visible { outline: none; }
.hs .lbl { position: absolute; left: 50%; top: 100%; transform: translate(-50%, -60%); padding: 3px 10px; border-radius: 999px; background: rgba(6, 4, 16, .85); border: 1px solid var(--c); font: 700 var(--fs, 12px) var(--font-body); white-space: nowrap; color: #fff; box-shadow: 0 0 10px color-mix(in srgb, var(--c) 50%, transparent); pointer-events: none; }
.hs .lbl i { font-style: normal; margin-right: 4px; color: var(--c); font-family: var(--font-num); }
.hs.locked .lbl { color: var(--dim); border-color: rgba(200, 190, 240, .4); box-shadow: none; }
.hs { z-index: 3; }

  const HIDEOUT_URL = PAGE("https://claude.ai/artifact/3GSx5C75eQ4oDq7jjGWaa5", "selectear_hideout.html");

  /* =========================================================
     DATA — from the spec (all provisional there)
     ========================================================= */
  const CITIES = [
    { no: 1, id: "sloth", name: "スリープ・ベッド", title: "月と怠惰の街", img: "img/city_sloth.webp", sin: "怠惰", c: "#48e1ff", district: "PARK 遊園地跡", where: "右（アジトの隣）・出発と帰還",
      view: "壊れた観覧車と、無数のゲーム看板が並ぶ電脳遊戯街。",
      gimmicks: ["眠りの霧（ブルーライト）：視界が悪く、一部のルートが隠されている。", "放置されたアーケード筐体を調べると、過去の記憶の断片（サブイベント）が見られる。"] },

      view: "巨大なクレーンとコンテナ倉庫、廃市場が連なる湾岸地区。",

    { no: 3, id: "greed", name: "ゴールド・バンク", title: "金と強欲の国", img: "img/city_greed.webp", sin: "強慾", c: "#f2c14e", district: "高層ビル群", where: "下",
      view: "紫と青のネオンが最も激しく輝く、かつての金融・ビジネス街。",

      view: "妖しいピンクと紫の煙が立ち込める、幻覚と娯楽の迷宮エリア。",
      gimmicks: ["幻惑のルート：正しい道を選ばないとスタート地点にループさせられる迷路ギミックがある。"] },

      view: "鉄骨がむき出しになり、火花と赤い警告灯が点滅する闘技場エリア。",
      gimmicks: ["強制バトルゾーン：回復ポイントが少なく、強敵（大罪の守護者）との連続バトルが待ち受ける戦闘特化エリア。"] },

      view: "巨大な十字のマークが光る研究施設と、その奥にそびえる旧中枢機関。",

  let scene = "start";
  /* progress (demo): cities are cleared in order 1→7 */
  let cleared = Math.max(0, Math.min(7, Number(store.get("selectear_progress", 0)) || 0));
  const stateOf = i => i < cleared ? "cleared" : i === cleared ? "open" : "locked";
  const STATE_JP = { locked: "未解放", open: "攻略可能", cleared: "制圧済み" };

  /* =========================================================

     ========================================================= */
  const CELL = [[1, 2], [0, 2], [0, 1], [0, 0], [2, 0], [2, 1], [2, 2]];
  const ROWSCALE = [.84, .92, 1];
  const NS = "http://www.w3.org/2000/svg";
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  // seeded random so each generic island always looks the same
  const rng = seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  // an isometric slab with a few blocky buildings, for cities that have no illustration yet
  function genericIsland(c, i) {
    const r = rng(17 + i * 31), col = c.c;
    const box = (x, y, a, h) => {
      const b = a / 2;
      const top = `${x - a},${y - h} ${x},${y - b - h} ${x + a},${y - h} ${x},${y + b - h}`;
      const left = `${x - a},${y - h} ${x},${y + b - h} ${x},${y + b} ${x - a},${y}`;
      const right = `${x},${y + b - h} ${x + a},${y - h} ${x + a},${y} ${x},${y + b}`;
      let win = "";
      for (let k = 0; k < Math.floor(h / 9); k++) if (r() > .35) win += `<rect x="${x + a * .25 + r() * a * .4}" y="${y - h + 6 + k * 9 + a * .05}" width="3" height="3" fill="${col}" opacity=".9"/>`;
      for (let k = 0; k < Math.floor(h / 9); k++) if (r() > .55) win += `<rect x="${x - a * .75 + r() * a * .4}" y="${y - h + 8 + k * 9}" width="3" height="3" fill="${col}" opacity=".6"/>`;
      return `<polygon points="${left}" fill="#0c0919"/><polygon points="${right}" fill="#151030"/><polygon points="${top}" fill="#221b40" stroke="${col}" stroke-opacity=".55" stroke-width=".8"/>${win}`;
    };
    const spots = [];
    for (let k = 0; k < 9; k++) { const u = r() * 2 - 1, v = r() * 2 - 1; if (Math.abs(u) + Math.abs(v) < .9) spots.push([100 + u * 62, 74 + v * 22, 9 + r() * 9, 14 + r() * 42]); }
    spots.sort((p, q) => p[1] - q[1]);
    return `<svg viewBox="0 0 200 140" xmlns="${NS}" aria-hidden="true">
      <polygon points="8,78 100,36 192,78 100,120" fill="#18122e" stroke="${col}" stroke-width="1.6"/>
      <polygon points="8,78 100,120 100,138 8,96" fill="#0a0716"/>
      <polygon points="100,120 192,78 192,96 100,138" fill="#110c24"/>
      <polyline points="8,78 100,120 192,78" fill="none" stroke="${col}" stroke-width="2" opacity=".9"/>
      <path d="M30 78L100 46L170 78" fill="none" stroke="${col}" stroke-opacity=".25"/><path d="M54 78L100 57L146 78L100 99Z" fill="none" stroke="${col}" stroke-opacity=".2"/>
      ${spots.map(([x, y, a, h]) => box(x, y, a, h)).join("")}
      <text x="100" y="${Math.min(...spots.map(s => s[1] - s[3])) - 6}" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="${col}" stroke-width=".6" style="paint-order:stroke">${c.sin[0]}</text>

  }
  function gzIsland(open) {
    return `<svg viewBox="0 0 200 140" xmlns="${NS}" aria-hidden="true">

      ${open ? "" : `<g class="barrier"><ellipse cx="100" cy="62" rx="78" ry="52" fill="rgba(255,77,94,.07)" stroke="#ff4d5e" stroke-width="2.5" stroke-dasharray="10 5"/></g>`}
      <filter id="bl"><feGaussianBlur stdDeviation="3"/></filter>

  }
  function hideIsland() {

  const fadeGain = (g, v, sec) => { const now = ac.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value, .0001), now); g.exponentialRampToValueAtTime(Math.max(v, .0001), now + sec); };
  const music = (() => {
    const el = new Audio(A("map_bgm.mp3")); el.loop = true; el.preload = "auto"; el.setAttribute("playsinline", "");
    let gain = null, on = false, t = 0;
    function route() { if (gain || !audio()) return; try { const s = ac.createMediaElementSource(el); gain = ac.createGain(); gain.gain.value = .0001; s.connect(gain).connect(master); } catch { gain = null; } }
    return {
      start() { if (on) return; on = true; clearTimeout(t); route(); const p = el.play(); if (p && p.catch) p.catch(() => { on = false; }); if (gain) fadeGain(gain.gain, .75, 1.5); else el.volume = .75; },
      stop() { if (!on) return; on = false; if (gain) fadeGain(gain.gain, 0, .8); t = setTimeout(() => { if (!on) el.pause(); }, 900); }
    };
  })();
  const ambience = (() => {
    let buf = null, loading = false, src = null, gain = null, want = false;
    function load() { if (buf || loading || !audio()) return; loading = true; fetch(A("city_ambience.mp3")).then(r => r.arrayBuffer()).then(b => new Promise((ok, ng) => ac.decodeAudioData(b, ok, ng))).then(b => { buf = b; if (want) { want = false; api.start(); } }).catch(() => { loading = false; }); }
    const api = {
      start() { if (!audio()) return; if (!buf) { want = true; load(); return; } if (src) return; gain = gain || (() => { const g = ac.createGain(); g.gain.value = .0001; g.connect(master); return g; })(); src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(gain); src.start(); fadeGain(gain.gain, .4, 1.5); },
      stop() { want = false; if (!src) return; const s = src; src = null; fadeGain(gain.gain, 0, .8); setTimeout(() => { try { s.stop(); } catch {} }, 900); }
    };
    return api;
  })();
  function syncMusic() {
    const on = st.bgm && !document.hidden && !away && (scene === "map" || scene === "overview");
    if (on) { music.start(); ambience.start(); } else { music.stop(); ambience.stop(); }
    $("snd").setAttribute("aria-pressed", String(st.bgm));
  }
  document.addEventListener("visibilitychange", syncMusic);
  $("snd").addEventListener("click", () => { audio(); st.bgm = !st.bgm; syncMusic(); try { const all = JSON.parse(localStorage.getItem("selectear_settings2") || "{}"); all.bgm = st.bgm; localStorage.setItem("selectear_settings2", JSON.stringify(all)); } catch {} });

  /* =========================================================
     OVERVIEW: tap spots in % of the overview picture (1670 × 941)
     ========================================================= */
  const OV_RATIO = 1670 / 941;
  const OV_SPOTS = [ // place index in PLACES, x, y, hit size (% of picture width)
    [1, 26, 16, 22], [7, 75, 17, 22], [2, 14, 42, 22], [6, 85, 44, 22], [3, 19, 71, 23], [4, 50, 82, 26], [5, 82, 72, 23], [8, 50, 44, 26]
  ];
  $("coinVal2").textContent = $("coinVal").textContent;
  function ovLayout() {
    const wrap = $("ovWrap"), W = innerWidth, H = innerHeight, top = 58, bot = 70;
    let w = W, h = W / OV_RATIO; const avail = H - top - bot;
    if (h > avail) { h = avail; w = h * OV_RATIO; }
    // phones held upright: let the picture run wider than the screen so the islands stay readable
    if (W / H < .8) { w = Math.min(W * 1.9, avail * OV_RATIO); h = w / OV_RATIO; }
    wrap.style.width = w + "px"; wrap.style.height = h + "px"; wrap.style.top = (top + avail / 2) + "px";
    ovMax = Math.max(0, (w - W) / 2); ovX = Math.max(-ovMax, Math.min(ovMax, ovX)); wrap.style.left = `calc(50% + ${ovX}px)`;
    $("overview").classList.toggle("pan", ovMax > 0);
    wrap.style.setProperty("--fs", Math.max(10, Math.min(14, w * .011)) + "px");
    wrap.querySelectorAll(".hs").forEach(b => { const sz = +b.dataset.s / 100 * w; b.style.width = sz + "px"; b.style.height = sz * .62 + "px"; });
  }
  function ovBuild() {
    const wrap = $("ovWrap"); wrap.querySelectorAll(".hs").forEach(n => n.remove());
    for (const [k, x, y, sz] of OV_SPOTS) {
      const p = PLACES[k], b = document.createElement("button"); b.type = "button"; b.className = "hs"; b.dataset.s = sz;
      const stt = p.kind === "city" ? stateOf(p.i) : p.kind === "gz" ? (cleared >= 7 ? "open" : "locked") : "open";
      const locked = stt === "locked";
      b.classList.add(stt); b.style.setProperty("--dl", (-(k * 1.37) % 4) + "s"); b.style.left = x + "%"; b.style.top = y + "%"; b.style.setProperty("--c", placeColor(p));
      const mark = stt === "cleared" ? '<b class="mk">CLEAR</b>' : stt === "open" && p.kind === "city" ? '<b class="mk nx">NEXT</b>' : stt === "locked" ? '<b class="mk lk">LOCK</b>' : "";
      const label = (p.kind === "city" ? `<i>${CITIES[p.i].no}</i>${esc(CITIES[p.i].name)}` : "GROUND ZERO") + mark;
      b.setAttribute("aria-label", (p.kind === "city" ? CITIES[p.i].no + " " + CITIES[p.i].name : "GROUND ZERO") + (locked ? "（未解放）" : ""));
      b.innerHTML = `<span class="br" aria-hidden="true"></span><span class="lbl">${stt === "cleared" ? '<span class="st">★</span>' : ""}${label}</span>`;
      const spot = on => { const sp = $("ovSpot"); if (on) { sp.style.setProperty("--sx", x + "%"); sp.style.setProperty("--sy", y + "%"); sp.style.setProperty("--sw", sz * .75 + "%"); sp.style.setProperty("--sh", sz * .75 * OV_RATIO * .62 + "%"); } sp.classList.toggle("on", on); };
      b.addEventListener("pointerenter", () => spot(true)); b.addEventListener("pointerleave", () => spot(false));
      b.addEventListener("focus", () => spot(true)); b.addEventListener("blur", () => spot(false));
      b.addEventListener("click", () => { if (!ovMoved) flyTo(k, x, y); });
      wrap.append(b);
    }
    ovLayout();
  }
  // zoom into the tapped island, then open the 3D view with that place in front
  function flyTo(k, x, y) {
    if (flying) return; flying = true; se("fly");
    const wrap = $("ovWrap"); wrap.classList.add("fly");
    const w = wrap.offsetWidth, h = wrap.offsetHeight;
    wrap.style.transform = `translate(-50%, -50%) translate(${(50 - x) / 100 * w * 2.4}px, ${(50 - y) / 100 * h * 2.4}px) scale(2.4)`; wrap.style.opacity = ".2";
    setTimeout(() => { sel = k; show("map"); flash(); wrap.classList.remove("fly"); wrap.style.transform = ""; wrap.style.opacity = ""; flying = false; }, reduce ? 0 : 650);
  }
  let flying = false, ovX = 0, ovMax = 0, ovDrag = null, ovMoved = false;
  // phones held upright: drag the picture sideways to see the islands at the edges
  $("overview").addEventListener("pointerdown", e => { if (!ovMax) return; ovDrag = { x: e.clientX, o: ovX }; ovMoved = false; });
  addEventListener("pointermove", e => { if (!ovDrag) return; const dx = e.clientX - ovDrag.x; if (Math.abs(dx) > 8) ovMoved = true; if (ovMoved) { ovX = Math.max(-ovMax, Math.min(ovMax, ovDrag.o + dx)); $("ovWrap").style.left = `calc(50% + ${ovX}px)`; } });
  addEventListener("pointerup", () => { ovDrag = null; setTimeout(() => { ovMoved = false; }, 0); });
  $("ovBack").addEventListener("click", () => { back(); if (EMB) toParent("home"); else show("start"); });
  $("ovHome").addEventListener("click", () => flyTo(0, 50, 100));
  addEventListener("resize", () => { if (scene === "overview") ovLayout(); });

  /* scenes */
  function show(id) {
    $("toast").hidden = true; for (const s of ["start", "overview", "map"]) $(s).classList.toggle("on", s === id); scene = id;
    if (id === "overview") ovBuild();
    if (id === "map") { draw(); fitFoot(); position(); }
    syncMusic();
  }
  $("startBtn").addEventListener("click", () => { audio(); if (st.bgm) { music.start(); ambience.start(); } gameStartSE(); buzz([30, 30, 60]); flash(); setTimeout(() => show("overview"), reduce ? 0 : 250); });
  $("toStart").addEventListener("click", () => { back(); closeSheet(); show("overview"); });
  // embedded: the home page says when this layer is shown or hidden; skip the start screen
  if (EMB) {
    $("ovBack").querySelector("span").textContent = "ホーム";
    addEventListener("message", e => {
      if (e.source !== parent || !e.data) return;
      if (e.data.selectear === "enter") { away = false; audio(); if (scene === "start") show("overview"); else syncMusic(); }
      if (e.data.selectear === "leave") { away = true; closeSheet(); syncMusic(); }
    });
    // audio may need a tap inside this frame first
    addEventListener("pointerdown", () => { if (!away) { audio(); syncMusic(); } }, true);
  }
  addEventListener("keydown", e => {
    if (e.key === "Escape") { if ($("sheet").classList.contains("on")) closeSheet(); else if (scene === "map") show("overview"); else if (scene === "overview") show("start"); }
    if (scene === "start" && (e.key === "Enter" || e.key === " ") && document.activeElement !== $("startBtn")) { e.preventDefault(); $("startBtn").click(); }
  });
})();
</script>
