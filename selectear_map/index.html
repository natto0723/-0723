<title>SELECTEAR City Map</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* NEON RUIN CITY — the outside world, drawn as a 2D tactical map (spec: 「NEON RUIN CITY マップデザイン説明書」).
   7 cities of the seven deadly sins sit round GROUND ZERO like a clock face turned 90°: 1 怠惰 on the right, then clockwise.
   アジト is next to 怠惰. Single dark neon look, same tokens and buttons as the home and hideout pages. */
:root {
  --bg: #05040b;
  --panel: rgba(12, 9, 24, .96);
  --ink: #f1efff;
  --dim: #a7a2c6;
  --violet: #9b5cff;
  --blue: #4f8cff;
  --ice: #d9e6ff;
  --gold: #f2c14e;
  --cyan: #48e1ff;
  --red: #ff4d5e;
  --line: rgba(150, 120, 255, .45);
  --font-latin: "Cinzel", "Times New Roman", serif;
  --font-menu: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-num: "Chakra Petch", "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-touch-callout: none; }
button, a { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.scene { position: fixed; inset: 0; display: none; overflow: hidden; }
.scene.on { display: block; animation: sceneIn .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes sceneIn { from { opacity: 0; } }
@keyframes blink { 50% { opacity: .3; } }
.flash { position: fixed; inset: 0; z-index: 90; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .8s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; padding: 10px 16px; border-radius: 12px; background: rgba(10, 8, 16, .95); border: 1px solid var(--violet); font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

/* ---------- START ---------- */
#start { background: radial-gradient(ellipse at 50% 60%, #1a0d33 0%, #07050c 70%); }
#start .bg { position: absolute; inset: -30px; background: url(img/map.webp) center / cover; filter: blur(14px) brightness(.35) saturate(1.3); }
#start .col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.logo { width: min(480px, 84vw); -webkit-mask-image: radial-gradient(ellipse 52% 60% at 50% 50%, #000 78%, transparent 100%); mask-image: radial-gradient(ellipse 52% 60% at 50% 50%, #000 78%, transparent 100%); filter: drop-shadow(0 0 18px rgba(155, 92, 255, .55)); }
.eyebrow { margin: 0; font: 600 12px var(--font-latin); letter-spacing: .45em; padding-left: .45em; color: var(--dim); }
.note { margin: 0; font-size: 12px; color: var(--dim); }
.mb { --k: 165, 110, 255; position: relative; height: 64px; width: min(320px, 80vw); border: 0; padding: 0 14% 0 16%; background: none; cursor: pointer; display: flex; align-items: center; gap: 12px; text-align: left; color: #f6ecff; text-decoration: none; }
.mb::before { content: ""; position: absolute; inset: 0; transform: skewX(-18deg); border: 1.5px solid #fff; border-radius: 4px; background: linear-gradient(90deg, rgba(var(--k), .6), rgba(var(--k), .25) 60%, rgba(20, 8, 36, .8)); box-shadow: 0 0 22px rgba(var(--k), .85), inset 0 0 18px rgba(255, 255, 255, .2); }
.mb > * { position: relative; }
.mb svg { width: 26px; height: 26px; flex: none; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linejoin: round; }
.mb .en { display: block; font: 700 26px/1 var(--font-menu); letter-spacing: .08em; text-shadow: 0 0 8px rgba(var(--k), .8); }
.mb .jp { display: block; margin-top: 3px; font: 700 12px/1 var(--font-body); color: rgba(255, 255, 255, .75); letter-spacing: .12em; }
.mb.pulse::before { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 36px rgba(var(--k), 1), inset 0 0 22px rgba(255, 255, 255, .3); } }

/* ---------- top bar ---------- */
.topbar { position: absolute; z-index: 10; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(5, 3, 12, .9), transparent); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.back, .snd, .zb { border: 1px solid rgba(201, 198, 214, .45); background: rgba(8, 5, 18, .8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); cursor: pointer; }
.back { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 10px; border-radius: 12px; font: 700 13px var(--font-body); }
.back svg, .snd svg, .zb svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.place { text-align: center; min-width: 0; }
.place b { display: block; font: 800 clamp(13px, 3.4vw, 17px)/1.1 var(--font-latin); letter-spacing: .22em; color: var(--ice); text-shadow: 0 0 10px rgba(155, 92, 255, .8); white-space: nowrap; }
.place small { display: block; margin-top: 3px; font: 700 11px var(--font-body); color: var(--dim); letter-spacing: .15em; }
.right { display: flex; align-items: center; gap: 8px; }
.snd { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; padding: 0; }
.snd .off { display: none; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="false"] .off { display: inline; }
.coins { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px 0 10px; border-radius: 999px; background: rgba(8, 5, 18, .8); border: 1px solid rgba(242, 193, 78, .55); }
.coin-ic { width: 20px; height: 20px; flex: none; background: linear-gradient(135deg, #fff6d0, var(--gold) 45%, #b9801a); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); filter: drop-shadow(0 0 4px var(--gold)); }
.coins .lb { font: 700 10px/1.1 var(--font-body); color: var(--dim); }
.coins .val { font: 700 17px/1 var(--font-num); color: #fff; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .coins .lb, .back span, .place small { display: none; } .back { padding: 0 10px; } }

/* ---------- MAP ---------- */
#map { background: radial-gradient(ellipse at 45% 50%, #120a26 0%, #05040b 75%); }
.viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
.viewport.drag { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.ease { transition: transform .6s cubic-bezier(.3, 0, .2, 1); }
.world svg { display: block; width: 100%; height: 100%; overflow: visible; }
svg text { font-family: var(--font-body); }
.node { cursor: pointer; }
.node .hex { transition: filter .2s; }
.node:hover .hex, .node:focus-visible .hex { filter: url(#glowStrong); }
.node:focus-visible { outline: none; }
.node.locked { opacity: .55; }
.node.locked .hexfill { fill: #1a1630; }
.node .ring { fill: none; stroke-width: 3; opacity: 0; }
.node.open .ring { animation: ringPulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ringPulse { 0% { opacity: .9; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.45); } }
.seg { fill: none; stroke-width: 3; stroke-linecap: round; }
.seg.lit { stroke-dasharray: 10 12; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -44; } }
.swirl { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
.swirl.rev { animation-duration: 22s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.barrier { animation: noise 2.6s steps(1) infinite; transition: opacity 1.2s; }
@keyframes noise { 0%, 100% { opacity: .95; } 31% { opacity: .55; } 33% { opacity: .95; } 62% { opacity: .7; } 64% { opacity: .95; } }
.gz.open .barrier { opacity: 0 !important; animation: none; }
.bridge { transition: stroke .8s, opacity .8s; }
.radar { transform-box: view-box; transform-origin: 540px 380px; animation: spin 9s linear infinite; }

/* status panel (bottom-left) + zoom (bottom-right) */
.status { position: absolute; z-index: 8; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; border-radius: 12px; background: rgba(8, 5, 18, .85); border: 1px solid var(--line); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; gap: 7px; max-width: calc(100% - 120px); }
.status .t { font: 700 11px var(--font-num); letter-spacing: .18em; color: var(--ice); }
.locks { display: flex; gap: 4px; align-items: center; }
.locks i { width: 18px; height: 8px; border-radius: 2px; background: #2a2440; border: 1px solid rgba(255, 255, 255, .2); }
.locks i.on { background: var(--c); box-shadow: 0 0 8px var(--c); border-color: #fff; }
.locks b { margin-left: 6px; font: 700 14px var(--font-num); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font: 700 10px var(--font-body); color: var(--dim); }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend i { width: 9px; height: 9px; transform: rotate(45deg); }
.status .demo { justify-self: start; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(201, 198, 214, .35); background: transparent; color: var(--dim); font: 700 10px var(--font-body); cursor: pointer; }
.zoom { position: absolute; z-index: 8; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.zb { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; padding: 0; }

/* info sheet: a side panel on wide screens, a bottom sheet on phones */
.sheet { position: absolute; z-index: 20; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 24px)); display: none; flex-direction: column; border-radius: 16px; background: var(--panel); border: 1px solid var(--c, var(--line)); box-shadow: 0 0 40px rgba(0, 0, 0, .6), 0 0 24px color-mix(in srgb, var(--c, #9b5cff) 35%, transparent); overflow: hidden; }
.sheet.on { display: flex; animation: slideIn .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }
.sh-head { position: relative; padding: 16px 48px 14px 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--c, #9b5cff) 40%, transparent), transparent 70%); border-bottom: 1px solid rgba(255, 255, 255, .1); }
.sh-head .no { font: 700 11px var(--font-num); letter-spacing: .2em; color: var(--c, var(--ice)); }
.sh-head h2 { margin: 4px 0 2px; font: 900 22px/1.2 var(--font-body); }
.sh-head .sub { font: 700 12px var(--font-body); color: var(--dim); }
.sh-head .x { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(0, 0, 0, .3); cursor: pointer; display: grid; place-items: center; padding: 0; }
.sh-head .x svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; }
.state { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; font: 700 11px var(--font-body); border: 1px solid; }
.state.locked { color: var(--dim); border-color: rgba(201, 198, 214, .4); }
.state.open { color: #fff; border-color: var(--c); background: color-mix(in srgb, var(--c) 30%, transparent); }
.state.cleared { color: #0b0716; background: var(--c); border-color: var(--c); }
.sh-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: grid; gap: 12px; align-content: start; user-select: text; -webkit-user-select: text; }
.sh-body h3 { margin: 0 0 4px; font: 700 11px var(--font-num); letter-spacing: .18em; color: var(--c, var(--ice)); }
.sh-body p { margin: 0; font-size: 13px; line-height: 1.75; }
.sh-body ul { margin: 0; padding-left: 1.2em; font-size: 13px; line-height: 1.75; }
.sh-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; border-top: 1px solid rgba(255, 255, 255, .1); }
.act { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 12px; border: 1px solid #fff; background: linear-gradient(90deg, color-mix(in srgb, var(--c, #9b5cff) 70%, transparent), color-mix(in srgb, var(--c, #9b5cff) 25%, transparent)); font: 800 15px var(--font-body); cursor: pointer; text-decoration: none; box-shadow: 0 0 16px color-mix(in srgb, var(--c, #9b5cff) 50%, transparent); }
.act:disabled { opacity: .45; cursor: default; box-shadow: none; }
.act.ghost { height: 38px; border-color: rgba(201, 198, 214, .35); background: transparent; box-shadow: none; font-size: 12px; color: var(--dim); }
@media (max-width: 700px) and (orientation: portrait) {
  .sheet { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 64%; border-radius: 18px 18px 0 0; border-bottom: 0; }
  @keyframes slideIn { from { transform: translateY(40px); opacity: 0; } }
}

/* unlock moment */
.unlock { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; pointer-events: none; text-align: center; }
.unlock.on { display: grid; animation: unlockIn 2.8s ease forwards; }
.unlock b { display: block; font: 800 clamp(22px, 6vw, 44px)/1.2 var(--font-latin); letter-spacing: .18em; color: #fff; text-shadow: 0 0 12px var(--violet), 0 0 40px var(--violet); }
.unlock small { display: block; margin-top: 10px; font: 700 14px var(--font-body); letter-spacing: .2em; color: var(--ice); }
@keyframes unlockIn { 0% { opacity: 0; transform: scale(1.2); } 15%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

@media (max-width: 700px), (max-height: 500px) {
  .status { padding: 7px 10px; gap: 5px; }
  .status .legend { display: none; }
  .status .t { font-size: 9px; letter-spacing: .12em; }
  .locks i { width: 12px; height: 7px; }
}
@media (max-height: 500px) { .status .demo { display: none; } .zb { width: 36px; height: 36px; } }
@media (prefers-reduced-motion: reduce) { .mb.pulse::before, .node.open .ring, .seg.lit, .swirl, .barrier, .radar { animation: none !important; } }
</style>

<!-- START -->
<section class="scene on" id="start" aria-label="スタート">
  <div class="bg"></div>

    <p class="eyebrow">NEON RUIN CITY</p>

<!-- MAP -->

<script>
(() => {
  "use strict";

  const ASSETS = window.__ASSETS || null;
  const A = p => (ASSETS && ASSETS[p]) || p;
  if (ASSETS) {
    for (const el of document.querySelectorAll("[src]")) el.setAttribute("src", A(el.getAttribute("src")));
    for (const s of document.querySelectorAll("style")) s.textContent = s.textContent.replace(/url\((img\/[^)]+)\)/g, (m, q) => `url(${A(q)})`);
  }
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const st = Object.assign({ bgm: true, sound: true, vol: 70, vib: true }, store.get("selectear_settings2", {}));
  $("coinVal").textContent = (Number(store.get("selectear_coins", 0)) || 0).toLocaleString("ja-JP");
  // the hideout is its own page
  const HIDEOUT_URL = "https://claude.ai/artifact/3GSx5C75eQ4oDq7jjGWaa5";

  /* =========================================================
     DATA — from the spec (all provisional there)
     ========================================================= */
  const CITIES = [
    { no: 1, id: "sloth", name: "スロース・アーケード", sin: "怠惰", c: "#48e1ff", district: "PARK 遊園地跡", where: "右（アジトの隣）・出発と帰還",
      view: "壊れた観覧車と、無数のゲーム看板が並ぶ電脳遊戯街。",

    { no: 2, id: "gluttony", name: "グラトニー・マーケット", sin: "暴食", c: "#ff9b3d", district: "PORT 港湾エリア", where: "右下",
      view: "巨大なクレーンとコンテナ倉庫、廃市場が連なる湾岸地区。",
      gimmicks: ["物資の残骸：壊れた自動販売機やコンテナから、カード生成用の素材が多く手に入る。", "人の記憶の罪達（雑魚敵）が徘徊しており、連戦になりやすい。"] },
    { no: 3, id: "greed", name: "グリード・バンク", sin: "強慾", c: "#f2c14e", district: "高層ビル群", where: "下",
      view: "紫と青のネオンが最も激しく輝く、かつての金融・ビジネス街。",

    { no: 5, id: "lust", name: "ラスト・ネオン", sin: "色慾", c: "#ff6ec8", district: "FACTORY 工場跡〜歓楽街", where: "左上",

      gimmicks: ["幻惑のルート：正しい道を選ばないとスタート地点にループさせられる迷路ギミックがある。"] },
    { no: 6, id: "wrath", name: "ラース・コロシアム", sin: "憤怒", c: "#ff4d5e", district: "EAST 郊外周辺〜ドーム跡", where: "上",
      view: "鉄骨がむき出しになり、火花と赤い警告灯が点滅する闘技場エリア。",
      gimmicks: ["強制バトルゾーン：回復ポイントが少なく、強敵（大罪の守護者）との連続バトルが待ち受ける戦闘特化エリア。"] },
    { no: 7, id: "pride", name: "プライド・キャピトル", sin: "傲慢", c: "#a98bff", district: "CLINIC 医療区〜中枢議事堂", where: "右上",
      view: "巨大な十字のマークが光る研究施設と、その奥にそびえる旧中枢機関。",
      gimmicks: ["最深部の封印：ループと大崩落（ゼロ・デイ）の秘密が記録されたメインサーバーがある。ここを制圧すると一周が完成し、12時の怠惰から爆心地への橋が繋がる。"] }
  ];

  /* progress (demo): cities are cleared in order 1→7 for now (fixed or recommended order is still open in the spec) */
  let cleared = Math.max(0, Math.min(7, Number(store.get("selectear_progress", 0)) || 0));
  const stateOf = i => i < cleared ? "cleared" : i === cleared ? "open" : "locked";
  const STATE_JP = { locked: "未解放", open: "攻略可能", cleared: "制圧済み" };

  /* =========================================================
     MAP DRAWING (SVG, viewBox 1200 x 760)
     ========================================================= */
  const VW = 1200, VH = 760, CX = 540, CY = 380, RX = 340, RY = 290;
  // clock turned 90°: 怠惰 (12 o'clock) sits on the right, then clockwise every 360/7 degrees
  const ang = i => 90 + i * 360 / 7;
  const pt = d => ({ x: CX + RX * Math.sin(d * Math.PI / 180), y: CY - RY * Math.cos(d * Math.PI / 180) });
  for (const [i, c] of CITIES.entries()) Object.assign(c, pt(ang(i)));
  const HIDE = { x: 1070, y: CY };
  const NS = "http://www.w3.org/2000/svg";
  const hexPath = (x, y, r) => Array.from({ length: 6 }, (_, k) => { const a = Math.PI / 6 + k * Math.PI / 3; return `${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
  const arcPath = (d1, d2) => { let s = ""; for (let d = d1; d <= d2 + .01; d += 2) { const p = pt(Math.min(d, d2)); s += (s ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); } return s; };

  function draw() {
    const gap = 13; // degrees kept clear around each city on the route
    const segs = CITIES.map((c, i) => {
      const d1 = ang(i) + gap, d2 = ang(i + 1) - gap;
      const lit = i < cleared; // route from city i to the next is lit once city i is cleared
      return `<path class="seg ${lit ? "lit" : ""}" d="${arcPath(d1, d2)}" stroke="${lit ? c.c : "rgba(160,150,210,.28)"}" ${lit ? 'filter="url(#glow)"' : 'stroke-dasharray="4 8"'} marker-end="url(#arrow${lit ? "Lit" : ""})"/>`;
    }).join("");
    const nodes = CITIES.map((c, i) => {
      const s = stateOf(i);
      return `<g class="node ${s}" data-i="${i}" tabindex="0" role="button" aria-label="${c.no} ${c.name}（${c.sin}・${STATE_JP[s]}）">
        <polygon class="ring" points="${hexPath(c.x, c.y, 58)}" stroke="${c.c}"/>
        <polygon class="hex hexfill" points="${hexPath(c.x, c.y, 50)}" fill="url(#hexg${i})" stroke="${s === "locked" ? "rgba(200,190,240,.45)" : c.c}" stroke-width="3" ${s !== "locked" ? 'filter="url(#glow)"' : ""}/>
        <text x="${c.x}" y="${c.y + 13}" text-anchor="middle" font-size="38" font-weight="900" fill="${s === "locked" ? "#8f88b5" : "#fff"}">${c.sin[0]}</text>
        <circle cx="${c.x - 40}" cy="${c.y - 32}" r="14" fill="#0b0716" stroke="${s === "locked" ? "rgba(200,190,240,.5)" : c.c}" stroke-width="2"/>
        <text x="${c.x - 40}" y="${c.y - 27}" text-anchor="middle" font-size="14" font-weight="700" font-family="Chakra Petch, sans-serif" fill="#fff">${c.no}</text>
        ${s === "cleared" ? `<circle cx="${c.x + 40}" cy="${c.y - 32}" r="14" fill="#f2c14e"/><path d="M${c.x + 33} ${c.y - 32}l5 5 9-10" fill="none" stroke="#0b0716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
        ${s === "locked" ? `<g transform="translate(${c.x + 30} ${c.y - 46})"><rect x="0" y="9" width="20" height="15" rx="3" fill="#2a2440" stroke="#bdb6e0" stroke-width="1.5"/><path d="M4 9V6a6 6 0 0 1 12 0v3" fill="none" stroke="#bdb6e0" stroke-width="1.8"/></g>` : ""}
        <rect x="${c.x - 92}" y="${c.y + 58}" width="184" height="44" rx="8" fill="rgba(8,5,18,.88)" stroke="${s === "locked" ? "rgba(200,190,240,.3)" : c.c}" stroke-width="1.5"/>
        <text x="${c.x}" y="${c.y + 78}" text-anchor="middle" font-size="15" font-weight="700" fill="${s === "locked" ? "#a7a2c6" : "#fff"}">${c.name}</text>
        <text x="${c.x}" y="${c.y + 95}" text-anchor="middle" font-size="11" fill="#a7a2c6">${c.sin} ・ ${c.district}</text>
      </g>`;
    }).join("");
    const done = cleared >= 7, sl = CITIES[0];
    const svg = `<svg viewBox="0 0 ${VW} ${VH}" xmlns="${NS}" role="img" aria-label="外の世界の配置図">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(120,110,220,.12)" stroke-width="1"/></pattern>
        <radialGradient id="crater" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f3d9ff"/><stop offset="18%" stop-color="#c25cff"/><stop offset="55%" stop-color="#4a1680"/><stop offset="100%" stop-color="#0d0618"/></radialGradient>
        <radialGradient id="fog" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(155,92,255,.28)"/><stop offset="100%" stop-color="rgba(155,92,255,0)"/></radialGradient>
        ${CITIES.map((c, i) => `<radialGradient id="hexg${i}" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="${c.c}" stop-opacity=".55"/><stop offset="100%" stop-color="#0b0716"/></radialGradient>`).join("")}
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="rgba(160,150,210,.5)"/></marker>
        <marker id="arrowLit" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
      </defs>
      <!-- ground: the city picture as a faint texture under a tactical grid -->
      <image href="${A("img/map.webp")}" x="-60" y="-20" width="1320" height="800" preserveAspectRatio="xMidYMid slice" opacity=".16" filter="url(#soft)"/>
      <rect x="-400" y="-300" width="2000" height="1360" fill="url(#grid)"/>
      <circle cx="${CX}" cy="${CY}" r="330" fill="url(#fog)"/>
      <g class="radar"><path d="M${CX} ${CY}L${CX + 420} ${CY}A420 420 0 0 0 ${CX + 297} ${CY - 297}z" fill="rgba(72,225,255,.05)"/></g>
      ${[200, 300, 420].map(r => `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="rgba(120,110,220,.12)"/>`).join("")}
      <!-- the route round the 7 cities (clockwise) -->
      <g>${segs}</g>
      <text x="${CX + RX * .74 + 40}" y="${CY + RY * .74 + 26}" font-size="12" fill="#a7a2c6" font-weight="700">時計回り</text>
      <!-- ring road (the old Shuto Expressway inner circular route) -->
      <circle cx="${CX}" cy="${CY}" r="150" fill="none" stroke="rgba(200,190,240,.55)" stroke-width="7" opacity=".35"/>
      <circle cx="${CX}" cy="${CY}" r="150" fill="none" stroke="#d9e6ff" stroke-width="1.5" stroke-dasharray="10 8" opacity=".7"/>
      <text x="${CX}" y="${CY + 172}" text-anchor="middle" font-size="11" fill="#a7a2c6">環状線（かつての首都高都心環状線）</text>
      <!-- GROUND ZERO -->
      <g class="gz ${done ? "open" : ""}" id="gzNode" tabindex="0" role="button" aria-label="GROUND ZERO 爆心地（${done ? "侵入可能" : "封鎖中"}）" style="cursor:pointer">
        <circle cx="${CX}" cy="${CY}" r="108" fill="url(#crater)" opacity=".9"/>
        <g class="swirl"><path d="M${CX - 80} ${CY}a80 80 0 0 1 160 0" fill="none" stroke="rgba(255,220,255,.5)" stroke-width="3"/><path d="M${CX - 52} ${CY + 20}a56 56 0 0 0 104 -10" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/></g>
        <g class="swirl rev"><path d="M${CX + 96} ${CY + 18}a98 98 0 0 1 -180 30" fill="none" stroke="rgba(194,92,255,.7)" stroke-width="2.5"/></g>
        <polygon class="barrier" points="${hexPath(CX, CY, 124)}" fill="none" stroke="#ff4d5e" stroke-width="3" stroke-dasharray="14 6" filter="url(#glow)"/>
        <text x="${CX}" y="${CY - 6}" text-anchor="middle" font-size="22" font-weight="800" font-family="Cinzel, serif" fill="#fff" letter-spacing="3" filter="url(#glow)">GROUND ZERO</text>
        <text x="${CX}" y="${CY + 18}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">爆心地</text>
        <text x="${CX}" y="${CY + 40}" text-anchor="middle" font-size="11" font-weight="700" fill="${done ? "#4ce39a" : "#ff9aa8"}">${done ? "バリア解除・侵入可能" : "バリア（干渉ノイズ）で封鎖"}</text>
      </g>
      <!-- bridge from 怠惰 to the crater (after the full loop) -->
      <line class="bridge" x1="${sl.x - 56}" y1="${sl.y}" x2="${CX + 128}" y2="${CY}" stroke="${done ? "#fff" : "rgba(200,190,240,.35)"}" stroke-width="${done ? 5 : 3}" stroke-dasharray="${done ? "0" : "6 7"}" ${done ? 'filter="url(#glowStrong)"' : ""}/>
      <text x="${(sl.x + CX + 70) / 2}" y="${CY - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="${done ? "#fff" : "#a7a2c6"}">${done ? "橋が繋がった" : "一周後に橋"}</text>
      <!-- link and the hideout -->
      <line x1="${sl.x + 56}" y1="${sl.y}" x2="${HIDE.x - 74}" y2="${HIDE.y}" stroke="#d9e6ff" stroke-width="2" stroke-dasharray="3 5" opacity=".7"/>
      <g class="node home" id="hideNode" tabindex="0" role="button" aria-label="HIDEOUT アジト（拠点）">
        <rect x="${HIDE.x - 74}" y="${HIDE.y - 70}" width="148" height="140" rx="14" fill="rgba(25,14,52,.92)" stroke="#fff" stroke-width="2.5" filter="url(#glow)" class="hex"/>
        <path transform="translate(${HIDE.x - 22} ${HIDE.y - 58})" d="M2 22L22 6l20 16v20H30V30H14v12H2z" fill="rgba(155,92,255,.5)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        <text x="${HIDE.x}" y="${HIDE.y + 14}" text-anchor="middle" font-size="17" font-weight="800" font-family="Cinzel, serif" fill="#fff" letter-spacing="2">HIDEOUT</text>
        <text x="${HIDE.x}" y="${HIDE.y + 34}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">アジト</text>
        <text x="${HIDE.x}" y="${HIDE.y + 54}" text-anchor="middle" font-size="10.5" fill="#d9e6ff">広い屋敷・電脳世界の入口</text>
      </g>
      <g>${nodes}</g>
      <!-- HUD corners -->
      <g stroke="rgba(217,230,255,.55)" stroke-width="2" fill="none"><path d="M12 52V12H52"/><path d="M1148 12H1188V52"/><path d="M12 708V748H52"/><path d="M1148 748H1188V708"/></g>
      <text x="22" y="40" font-size="11" font-family="Chakra Petch, sans-serif" fill="rgba(217,230,255,.6)" letter-spacing="2">TACTICAL MAP / TOKYO</text>
      <!-- compass -->
      <g transform="translate(1130 680)" opacity=".7"><circle r="26" fill="none" stroke="#d9e6ff"/><path d="M0 -22L6 0 0 22 -6 0z" fill="none" stroke="#d9e6ff" stroke-width="1.5"/><text y="-30" text-anchor="middle" font-size="11" fill="#d9e6ff" font-family="Chakra Petch, sans-serif">N</text></g>
    </svg>`;
    $("world").innerHTML = svg;
    for (const n of document.querySelectorAll(".node[data-i]")) bindTap(n, () => openCity(+n.dataset.i));
    bindTap($("hideNode"), openHideout);
    bindTap($("gzNode"), openGZ);
    $("locks").innerHTML = CITIES.map((c, i) => `<i class="${i < cleared ? "on" : ""}" style="--c:${c.c}" title="${c.sin}"></i>`).join("") + `<b>${cleared}/7</b>`;
  }
  function bindTap(el, fn) {
    el.addEventListener("click", e => { e.stopPropagation(); if (moved) return; fn(); });
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } });
  }

  /* =========================================================
     INFO SHEET
     ========================================================= */
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const closeIco = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function sheet(color, html) { const s = $("sheet"); s.style.setProperty("--c", color); s.innerHTML = html; s.classList.add("on"); s.querySelector(".x").addEventListener("click", closeSheet); }
  function closeSheet() { $("sheet").classList.remove("on"); }
  function openCity(i) {
    const c = CITIES[i], s = stateOf(i); decide(); focusOn(c.x, c.y);
    sheet(c.c, `<div class="sh-head"><span class="no">CITY ${c.no} / 7 ・ ${esc(c.where)}</span><h2>${esc(c.name)}</h2><div class="sub">大罪：${esc(c.sin)} ・ ${esc(c.district)}</div><span class="state ${s}">${STATE_JP[s]}</span><button class="x" type="button" aria-label="閉じる">${closeIco}</button></div>
      <div class="sh-body"><div><h3>LANDMARK — ランドマーク・景観</h3><p>${esc(c.view)}</p></div>
      <div><h3>GIMMICK — ギミック・探索要素</h3><ul>${c.gimmicks.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
      ${s === "locked" ? `<p style="color:var(--dim)">ひとつ前の都市（${esc(CITIES[i - 1].name)}）を攻略すると解放されます。</p>` : ""}</div>
      <div class="sh-foot"><button class="act" type="button" id="goCity" ${s === "locked" ? "disabled" : ""}>${s === "cleared" ? "もう一度探索する" : "攻略に出発する"}</button>${s === "open" ? '<button class="act ghost" type="button" id="demoClear">攻略済みにする（デモ）</button>' : ""}</div>`);
    const go = $("goCity"); if (go && !go.disabled) go.addEventListener("click", () => { decide(); toast("バトルと探索は準備中です"); });
    const dc = $("demoClear"); if (dc) dc.addEventListener("click", () => clearCity(i));
  }
  function openGZ() {
    const done = cleared >= 7; decide(); focusOn(CX, CY);
    sheet(done ? "#c25cff" : "#ff4d5e", `<div class="sh-head"><span class="no">FINAL DESTINATION</span><h2>GROUND ZERO</h2><div class="sub">爆心地 ・ マップ中心（東京の中心）</div><span class="state ${done ? "open" : "locked"}" style="--c:#c25cff">${done ? "侵入可能" : "封鎖中"}</span><button class="x" type="button" aria-label="閉じる">${closeIco}</button></div>
      <div class="sh-body"><div><h3>VIEW — 外観</h3><p>東京の中心にぽっかりと空いた巨大なクレーターと、紫色のエネルギーが渦巻く領域。高速道路のような環状線（かつての首都高都心環状線）が取り囲む。</p></div>
      <div><h3>LOCK — 封鎖</h3><p>強力なバリア（干渉ノイズ）で閉ざされている。七つの大罪の都市をすべて攻略し、記憶のロックを解除すると入れる。</p></div>
      <div><h3>ENTRANCE — 入り口</h3><p>7都市を一周し、12時の怠惰（スロース・アーケード）に戻ると、そこから爆心地への橋が繋がる。</p></div>
      <p>記憶のロック：<b>${cleared} / 7</b> 解除</p></div>
      <div class="sh-foot"><button class="act" type="button" id="goGZ" ${done ? "" : "disabled"}>${done ? "爆心地へ侵入する" : "まだ入れない"}</button></div>`);
    if (done) $("goGZ").addEventListener("click", () => { decide(); toast("GROUND ZERO は準備中です"); });
  }
  function openHideout() {
    decide(); focusOn(HIDE.x, HIDE.y);
    sheet("#9b5cff", `<div class="sh-head"><span class="no">HOME BASE</span><h2>HIDEOUT（アジト）</h2><div class="sub">広い屋敷 ・ 最初の都市（怠惰）のすぐ隣</div><span class="state open" style="--c:#9b5cff">拠点</span><button class="x" type="button" aria-label="閉じる">${closeIco}</button></div>
      <div class="sh-body"><p>プレイヤーの拠点である広い屋敷。外の世界への出発点で、電脳世界への入り口でもある。ホーム画面への帰還ポイント。</p>
      <div><h3>WHAT YOU CAN DO — アジトでできること</h3><ul><li>デッキ構築</li><li>記憶の解放（スキルツリー）</li><li>相棒との会話</li><li>電脳世界へ入る（インターネット対戦・CPU対戦など）</li></ul></div></div>
      <div class="sh-foot"><a class="act" href="${HIDEOUT_URL}" target="_blank" rel="noopener" id="goHide">アジトに入る</a></div>`);
    $("goHide").addEventListener("click", () => gameStartSE());
  }
  function clearCity(i) {
    if (i !== cleared) return;
    cleared++; store.set("selectear_progress", cleared); gameStartSE(); buzz([30, 30, 60]);
    closeSheet(); draw();
    if (cleared >= 7) {
      flash(); const u = $("unlock"); u.classList.remove("on"); void u.offsetWidth; u.classList.add("on");
      setTimeout(() => focusOn(CX, CY), 400);
      toast("7都市を一周した。爆心地への橋が繋がった");
    } else {
      const n = CITIES[cleared]; toast(`${CITIES[i].name} を制圧。${n.name} が解放された`);
      setTimeout(() => focusOn(n.x, n.y), 300);
    }
  }
  $("resetDemo").addEventListener("click", () => { back(); cleared = 0; store.set("selectear_progress", 0); closeSheet(); draw(); toast("進行をリセットしました"); });

  /* =========================================================
     PAN + ZOOM
     ========================================================= */
  const vp = $("vp"), world = $("world");
  let W = 0, H = 0, fw = 0, fh = 0, z = 1, ox = 0, oy = 0;
  function layout() {
    W = innerWidth; H = innerHeight;
    // fit the whole map on wide screens; on tall phones fit the height and drag sideways
    const top = 60, s = Math.min(W / VW, (H - top) / VH);
    const sTall = (H - top) / VH;
    const base = W / H < 1 ? sTall : s;
    fw = VW * base; fh = VH * base;
    world.style.width = fw + "px"; world.style.height = fh + "px";
    clamp(); apply();
  }
  function clamp() {
    const w = fw * z, h = fh * z, top = 56;
    ox = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, ox));
    oy = h <= H - top ? top + (H - top - h) / 2 : Math.min(top, Math.max(H - h, oy));
  }
  function apply() { world.style.transform = `translate(${ox}px, ${oy}px) scale(${z})`; }
  function focusOn(x, y, ease = true) {
    const sx = x / VW * fw * z, sy = y / VH * fh * z;
    const sheetW = $("sheet").classList.contains("on") && W > 700 ? Math.min(380, W - 24) + 12 : 0;
    const sheetH = $("sheet").classList.contains("on") && W <= 700 && H > W ? H * .64 : 0;
    ox = (W - sheetW) / 2 - sx; oy = (H - sheetH) / 2 + 20 - sy; clamp();
    world.classList.toggle("ease", ease && !reduce); apply();
  }
  function zoomBy(f) { const cx = W / 2, cy = H / 2, wx = (cx - ox) / z, wy = (cy - oy) / z; z = Math.min(2.4, Math.max(1, z * f)); ox = cx - wx * z; oy = cy - wy * z; clamp(); world.classList.add("ease"); apply(); }
  $("zin").addEventListener("click", () => { decide(); zoomBy(1.35); });
  $("zout").addEventListener("click", () => { decide(); zoomBy(1 / 1.35); });
  vp.addEventListener("wheel", e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.12 : 1 / 1.12; const wx = (e.clientX - ox) / z, wy = (e.clientY - oy) / z; z = Math.min(2.4, Math.max(1, z * f)); ox = e.clientX - wx * z; oy = e.clientY - wy * z; clamp(); world.classList.remove("ease"); apply(); }, { passive: false });
  let drag = null, moved = false;
  vp.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; moved = false; world.classList.remove("ease"); });
  addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 6) { moved = true; vp.classList.add("drag"); } if (moved) { ox = drag.ox + dx; oy = drag.oy + dy; clamp(); apply(); } });
  addEventListener("pointerup", () => { drag = null; vp.classList.remove("drag"); setTimeout(() => { moved = false; }, 0); });
  vp.addEventListener("click", () => { if (!moved) closeSheet(); });
  addEventListener("resize", () => { if (scene === "map") layout(); });

  /* =========================================================
     SOUND: map music + city ambience (same files as before)
     ========================================================= */
  let ac = null, master = null;
  function audio() { try { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); } master.gain.value = st.vol / 100; if (ac.state === "suspended") ac.resume(); return ac; } catch { return null; } }
  function tone(f, d, type = "square", v = .1, delay = 0) { if (!st.sound || !audio()) return; try { const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(master); o.start(t); o.stop(t + d + .02); } catch {} }
  const decide = () => { tone(1046, .06, "square", .07); tone(1568, .1, "square", .06, .05); };
  const back = () => { tone(784, .08, "triangle", .08); tone(523, .12, "triangle", .06, .06); };
  const seEl = new Audio(A("se_gamestart.mp3")); seEl.preload = "auto";
  function gameStartSE() { if (!st.sound) return; try { const a = seEl.cloneNode(); a.volume = Math.min(1, st.vol / 100); const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch {} }
  const buzz = ms => { if (st.vib) try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  function toast(t) { const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2400); }
  function flash() { const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
  const fadeGain = (g, v, sec) => { const now = ac.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value, .0001), now); g.exponentialRampToValueAtTime(Math.max(v, .0001), now + sec); };
  const music = (() => {
    const el = new Audio(A("map_bgm.mp3")); el.loop = true; el.preload = "auto"; el.setAttribute("playsinline", "");
    let gain = null, on = false, t = 0;
    function route() { if (gain || !audio()) return; try { const s = ac.createMediaElementSource(el); gain = ac.createGain(); gain.gain.value = .0001; s.connect(gain).connect(master); } catch { gain = null; } }
    return {
      start() { if (on) return; on = true; clearTimeout(t); route(); const p = el.play(); if (p && p.catch) p.catch(() => { on = false; }); if (gain) fadeGain(gain.gain, .75, 1.5); else el.volume = .75; },
      stop() { if (!on) return; on = false; if (gain) fadeGain(gain.gain, 0, .8); t = setTimeout(() => { if (!on) el.pause(); }, 900); }
    };
  })();
  const ambience = (() => {
    let buf = null, loading = false, src = null, gain = null, want = false;
    function load() { if (buf || loading || !audio()) return; loading = true; fetch(A("city_ambience.mp3")).then(r => r.arrayBuffer()).then(b => new Promise((ok, ng) => ac.decodeAudioData(b, ok, ng))).then(b => { buf = b; if (want) { want = false; api.start(); } }).catch(() => { loading = false; }); }
    const api = {
      start() { if (!audio()) return; if (!buf) { want = true; load(); return; } if (src) return; gain = gain || (() => { const g = ac.createGain(); g.gain.value = .0001; g.connect(master); return g; })(); src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(gain); src.start(); fadeGain(gain.gain, .4, 1.5); },
      stop() { want = false; if (!src) return; const s = src; src = null; fadeGain(gain.gain, 0, .8); setTimeout(() => { try { s.stop(); } catch {} }, 900); }
    };
    return api;
  })();
  function syncMusic() {
    const on = st.bgm && !document.hidden && scene === "map";
    if (on) { music.start(); ambience.start(); } else { music.stop(); ambience.stop(); }
    $("snd").setAttribute("aria-pressed", String(st.bgm));
  }
  document.addEventListener("visibilitychange", syncMusic);
  $("snd").addEventListener("click", () => { audio(); st.bgm = !st.bgm; syncMusic(); try { const all = JSON.parse(localStorage.getItem("selectear_settings2") || "{}"); all.bgm = st.bgm; localStorage.setItem("selectear_settings2", JSON.stringify(all)); } catch {} });

  /* scenes */
  let scene = "start", first = true;
  function show(id) {
    $("toast").hidden = true; for (const s of ["start", "map"]) $(s).classList.toggle("on", s === id); scene = id;
    if (id === "map") { layout(); if (first) { first = false; z = H < 500 ? 1.7 : 1; clamp(); focusOn(CITIES[0].x + 120, CY, false); } }
    syncMusic();
  }
  $("startBtn").addEventListener("click", () => { audio(); if (st.bgm) { music.start(); ambience.start(); } gameStartSE(); buzz([30, 30, 60]); flash(); setTimeout(() => show("map"), reduce ? 0 : 250); });
  $("toStart").addEventListener("click", () => { back(); closeSheet(); show("start"); });
  addEventListener("keydown", e => {
    if (e.key === "Escape") { if ($("sheet").classList.contains("on")) closeSheet(); else if (scene === "map") show("start"); }
    if (scene === "start" && (e.key === "Enter" || e.key === " ") && document.activeElement !== $("startBtn")) { e.preventDefault(); $("startBtn").click(); }
  });
  draw();
})();
</script>
